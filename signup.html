<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070909">

<title>Create Account | Nova Musical</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

:root{
  --bg:#070909;
  --panel:#101313;
  --panel2:#151919;
  --border:#252b2b;
  --text:#f4f7f6;
  --muted:#8e9996;
  --green:#55e6a5;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
}

body:before{
  content:"";
  position:fixed;
  top:-220px;
  left:50%;
  transform:translateX(-50%);
  width:480px;
  height:480px;
  border-radius:50%;
  background:rgba(85,230,165,.09);
  filter:blur(90px);
  pointer-events:none;
}

.page{
  position:relative;
  width:100%;
  max-width:520px;
  padding:max(30px,env(safe-area-inset-top)) 22px max(35px,env(safe-area-inset-bottom));
}

.brand{
  text-align:center;
  margin:18px 0 38px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{color:var(--green)}

.badge{
  display:inline-block;
  margin-top:10px;
  padding:6px 11px;
  border:1px solid rgba(85,230,165,.28);
  border-radius:999px;
  color:var(--green);
  background:rgba(85,230,165,.06);
  font-size:10px;
  font-weight:800;
  letter-spacing:1.2px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:24px;
  padding:27px 21px 25px;
}

h1{
  text-align:center;
  margin:0 0 9px;
  font-size:29px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin-bottom:27px;
}

.field{margin-bottom:17px}

label{
  display:block;
  margin:0 0 8px 2px;
  font-size:13px;
  font-weight:700;
}

input{
  width:100%;
  height:52px;
  border:1px solid var(--border);
  border-radius:14px;
  outline:none;
  padding:0 15px;
  background:var(--panel2);
  color:var(--text);
  font-size:16px;
}

input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(85,230,165,.08);
}

.username{
  position:relative;
}

.username span{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

#username{padding-left:32px}

.hint{
  margin:7px 2px 0;
  color:var(--muted);
  font-size:11px;
}

.submit{
  width:100%;
  min-height:54px;
  border:0;
  border-radius:15px;
  background:var(--green);
  color:#06110c;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.submit:disabled{opacity:.55}

.message{
  display:none;
  margin-top:17px;
  padding:13px;
  border-radius:13px;
  font-size:13px;
  line-height:1.5;
}

.message.error{
  display:block;
  color:#ffaaaa;
  border:1px solid rgba(255,100,100,.2);
  background:rgba(255,100,100,.06);
}

.message.success{
  display:block;
  color:#a0f4ce;
  border:1px solid rgba(85,230,165,.23);
  background:rgba(85,230,165,.06);
}

.login{
  text-align:center;
  margin-top:22px;
  color:var(--muted);
  font-size:13px;
}

a{
  color:var(--green);
  text-decoration:none;
  font-weight:750;
}

.footer{
  margin-top:34px;
  text-align:center;
  color:#59625f;
  font-size:10px;
  line-height:1.7;
}
</style>
</head>

<body>

<main class="page">

<header class="brand">
  <div class="logo">
    NOVA <span>MUSICAL</span>
  </div>

  <div class="badge">
    NOVA AI MUSIC LEARNING
  </div>
</header>

<section class="card">

<h1>Create your account</h1>

<p class="subtitle">
  Join Nova Musical and begin your learning journey.
</p>

<form id="signupForm">

<div class="field">
  <label for="name">Name</label>

  <input
    id="name"
    type="text"
    autocomplete="name"
    placeholder="Your name"
    maxlength="60"
    required
  >
</div>

<div class="field">

  <label for="username">Username</label>

  <div class="username">

    <span>@</span>

    <input
      id="username"
      type="text"
      autocomplete="username"
      placeholder="username"
      maxlength="24"
      autocapitalize="none"
      spellcheck="false"
      required
    >

  </div>

  <div class="hint">
    3–24 characters. Letters, numbers and underscores.
  </div>

</div>

<div class="field">

  <label for="email">Email</label>

  <input
    id="email"
    type="email"
    autocomplete="email"
    placeholder="you@example.com"
    autocapitalize="none"
    required
  >

</div>

<div class="field">

  <label for="password">Password</label>

  <input
    id="password"
    type="password"
    autocomplete="new-password"
    placeholder="At least 8 characters"
    minlength="8"
    required
  >

</div>

<button
  id="submitButton"
  class="submit"
  type="submit"
>
  CREATE ACCOUNT
</button>

<div
  id="message"
  class="message"
  role="status"
  aria-live="polite"
></div>

</form>

<div class="login">
  Already have an account?
  <a href="login.html">Log in</a>
</div>

</section>

<footer class="footer">
  © 2026 Nova Musical<br>
  Andrea Fredy • Aryan Jude Fredy
</footer>

</main>

<script>

const SUPABASE_URL =
  "https://docyfgbghwncylldlcfs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9m_olDXjv4gjSWklXvhg-g_vDwcbBRk";

const novaSupabase =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );

const form =
  document.getElementById("signupForm");

const usernameInput =
  document.getElementById("username");

const message =
  document.getElementById("message");

const submitButton =
  document.getElementById("submitButton");


usernameInput.addEventListener(
  "input",
  () => {

    usernameInput.value =
      usernameInput.value
        .toLowerCase()
        .replace(/[^a-z0-9_]/g,"");

  }
);


function showMessage(text,type){

  message.textContent = text;

  message.className =
    "message " + type;
}


async function checkExistingSession(){

  const {
    data:{session}
  } =
    await novaSupabase.auth.getSession();

  if(session){

    window.location.replace(
      "instruments.html"
    );

  }
}

checkExistingSession();


form.addEventListener(
  "submit",
  async(event) => {

    event.preventDefault();

    const displayName =
      document
        .getElementById("name")
        .value
        .trim();

    const username =
      usernameInput.value
        .trim()
        .toLowerCase();

    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
      document
        .getElementById("password")
        .value;


    if(!displayName){

      showMessage(
        "Please enter your name.",
        "error"
      );

      return;
    }


    if(!/^[a-z0-9_]{3,24}$/.test(username)){

      showMessage(
        "Username must be 3–24 characters using letters, numbers or underscores.",
        "error"
      );

      return;
    }


    if(password.length < 8){

      showMessage(
        "Your password must contain at least 8 characters.",
        "error"
      );

      return;
    }


    submitButton.disabled = true;

    submitButton.textContent =
      "CREATING ACCOUNT...";


    try{

      const {
        data,
        error
      } =
        await novaSupabase.auth.signUp({

          email,

          password,

          options:{
            data:{
              username:username,
              display_name:displayName
            }
          }

        });


      if(error){
        throw error;
      }


      if(!data.user){

        throw new Error(
          "Nova couldn't create your account."
        );

      }


      if(!data.session){

        throw new Error(
          "Your account was created, but Nova couldn't sign you in automatically."
        );

      }


      showMessage(
        "Account created. Let's choose your instrument...",
        "success"
      );


      setTimeout(
        () => {

          window.location.replace(
            "instruments.html"
          );

        },
        500
      );


    }catch(error){

      console.error(
        "Nova signup error:",
        error
      );


      let text =
        error?.message ||
        "Nova couldn't create your account.";


      const lower =
        text.toLowerCase();


      if(
        lower.includes("duplicate") ||
        lower.includes("unique")
      ){

        text =
          "That username is already taken. Please choose another username.";

      }


      if(
        lower.includes("already registered") ||
        lower.includes("already been registered")
      ){

        text =
          "An account already exists with that email. Try logging in instead.";

      }


      showMessage(
        text,
        "error"
      );


    }finally{

      submitButton.disabled = false;

      submitButton.textContent =
        "CREATE ACCOUNT";

    }

  }
);

</script>

</body>
</html>
