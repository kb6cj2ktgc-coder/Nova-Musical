<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070909">

<title>Log In | Nova Musical</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

:root{
  --bg:#070909;
  --panel:#101313;
  --panel2:#151919;
  --border:#252b2b;
  --text:#f4f7f6;
  --muted:#8e9996;
  --green:#55e6a5;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
}

body:before{
  content:"";
  position:fixed;
  top:-220px;
  left:50%;
  transform:translateX(-50%);
  width:480px;
  height:480px;
  border-radius:50%;
  background:rgba(85,230,165,.09);
  filter:blur(90px);
  pointer-events:none;
}

.page{
  position:relative;
  width:100%;
  max-width:520px;
  min-height:100dvh;
  padding:max(30px,env(safe-area-inset-top)) 22px max(35px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
}

.brand{
  text-align:center;
  margin:18px 0 42px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:var(--green);
}

.badge{
  display:inline-block;
  margin-top:10px;
  padding:6px 11px;
  border:1px solid rgba(85,230,165,.28);
  border-radius:999px;
  color:var(--green);
  background:rgba(85,230,165,.06);
  font-size:10px;
  font-weight:800;
  letter-spacing:1.2px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:24px;
  padding:29px 21px 25px;
}

h1{
  text-align:center;
  margin:0 0 9px;
  font-size:30px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin-bottom:28px;
}

.field{
  margin-bottom:18px;
}

label{
  display:block;
  margin:0 0 8px 2px;
  font-size:13px;
  font-weight:700;
}

input{
  width:100%;
  height:52px;
  padding:0 15px;
  border:1px solid var(--border);
  border-radius:14px;
  outline:none;
  background:var(--panel2);
  color:var(--text);
  font-size:16px;
}

input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(85,230,165,.09);
}

.username,
.password{
  position:relative;
}

.username span{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

#username{
  padding-left:32px;
}

#password{
  padding-right:68px;
}

.show{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:var(--green);
  font-size:12px;
  font-weight:800;
}

.forgot{
  text-align:right;
  margin-top:-6px;
  margin-bottom:19px;
}

.forgot a{
  color:var(--green);
  text-decoration:none;
  font-size:12px;
  font-weight:700;
}

.submit{
  width:100%;
  height:54px;
  border:0;
  border-radius:15px;
  background:var(--green);
  color:#06110c;
  font-size:15px;
  font-weight:900;
}

.submit:disabled{
  opacity:.55;
}

.message{
  display:none;
  margin-top:17px;
  padding:13px;
  border-radius:13px;
  font-size:13px;
  line-height:1.5;
}

.message.error{
  display:block;
  color:#ffaaaa;
  border:1px solid rgba(255,100,100,.2);
  background:rgba(255,100,100,.06);
}

.message.success{
  display:block;
  color:#a0f4ce;
  border:1px solid rgba(85,230,165,.23);
  background:rgba(85,230,165,.06);
}

.signup{
  text-align:center;
  margin-top:24px;
  color:var(--muted);
  font-size:13px;
}

.signup a{
  color:var(--green);
  text-decoration:none;
  font-weight:750;
}

.footer{
  margin-top:auto;
  padding-top:35px;
  text-align:center;
  color:#59625f;
  font-size:10px;
  line-height:1.7;
}
</style>
</head>

<body>

<main class="page">

<header class="brand">

  <div class="logo">
    NOVA <span>MUSICAL</span>
  </div>

  <div class="badge">
    NOVA AI MUSIC LEARNING
  </div>

</header>


<section class="card">

<h1>Welcome back</h1>

<p class="subtitle">
  Log in to continue your Nova journey.
</p>


<form id="loginForm">

<div class="field">

  <label for="username">
    Username
  </label>

  <div class="username">

    <span>@</span>

    <input
      id="username"
      type="text"
      placeholder="username"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      maxlength="24"
      required
    >

  </div>

</div>


<div class="field">

  <label for="password">
    Password
  </label>

  <div class="password">

    <input
      id="password"
      type="password"
      placeholder="Your password"
      autocomplete="current-password"
      required
    >

    <button
      id="showPassword"
      class="show"
      type="button"
    >
      SHOW
    </button>

  </div>

</div>


<div class="forgot">

  <a href="forgot-password.html">
    Forgot password?
  </a>

</div>


<button
  id="submitButton"
  class="submit"
  type="submit"
>
  LOG IN
</button>


<div
  id="message"
  class="message"
  role="status"
  aria-live="polite"
></div>

</form>


<div class="signup">

  New to Nova?

  <a href="signup.html">
    Create account
  </a>

</div>

</section>


<footer class="footer">
  © 2026 Nova Musical<br>
  Andrea Fredy • Aryan Jude Fredy
</footer>

</main>


<script>

const SUPABASE_URL =
  "https://docyfgbghwncylldlcfs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9m_olDXjv4gjSWklXvhg-g_vDwcbBRk";

const LOGIN_ENDPOINT =
  "https://nova-guitar-ai.kb6cj2ktgc.workers.dev/auth/login";


const novaSupabase =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


const form =
  document.getElementById("loginForm");

const usernameInput =
  document.getElementById("username");

const passwordInput =
  document.getElementById("password");

const submitButton =
  document.getElementById("submitButton");

const message =
  document.getElementById("message");

const showPassword =
  document.getElementById("showPassword");


usernameInput.addEventListener(
  "input",
  () => {

    usernameInput.value =
      usernameInput.value
        .toLowerCase()
        .replace(/[^a-z0-9_]/g,"");

  }
);


showPassword.addEventListener(
  "click",
  () => {

    const hidden =
      passwordInput.type === "password";

    passwordInput.type =
      hidden ? "text" : "password";

    showPassword.textContent =
      hidden ? "HIDE" : "SHOW";

  }
);


function showMessage(text,type){

  message.textContent = text;

  message.className =
    "message " + type;

}


async function checkExistingSession(){

  try{

    const {
      data:{session}
    } =
      await novaSupabase.auth.getSession();


    if(session){

      window.location.replace(
        "instruments.html"
      );

    }

  }catch(error){

    console.error(
      "Nova session check:",
      error
    );

  }
}


checkExistingSession();


form.addEventListener(
  "submit",
  async(event) => {

    event.preventDefault();


    const username =
      usernameInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;


    if(!username || !password){

      showMessage(
        "Enter your username and password.",
        "error"
      );

      return;
    }


    submitButton.disabled = true;

    submitButton.textContent =
      "LOGGING IN...";


    try{

      const response =
        await fetch(
          LOGIN_ENDPOINT,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              username,
              password
            })
          }
        );


      let result = {};

      try{

        result =
          await response.json();

      }catch(error){

        throw new Error(
          "Nova received an unreadable login response."
        );

      }


      if(!response.ok){

        throw new Error(
          result?.error ||
          "Incorrect username or password."
        );

      }


      if(
        !result.access_token ||
        !result.refresh_token
      ){

        throw new Error(
          "Nova couldn't start your session."
        );

      }


      const {
        error:sessionError
      } =
        await novaSupabase.auth.setSession({

          access_token:
            result.access_token,

          refresh_token:
            result.refresh_token

        });


      if(sessionError){
        throw sessionError;
      }


      showMessage(
        "Welcome back. Let's choose your instrument...",
        "success"
      );


      setTimeout(
        () => {

          window.location.replace(
            "instruments.html"
          );

        },
        450
      );


    }catch(error){

      console.error(
        "Nova login error:",
        error
      );


      showMessage(
        error?.message ||
        "Incorrect username or password.",
        "error"
      );


    }finally{

      submitButton.disabled = false;

      submitButton.textContent =
        "LOG IN";

    }

  }
);

</script>

</body>
</html>
