<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101416">

<title>Nova Musical — Guitar Tuner</title>

<style>
:root{
  --bg:#101416;
  --panel:#171c1f;
  --white:#f7f7f7;
  --muted:#8c9297;
  --green:#16d59a;
  --yellow:#e5d84c;
  --red:#ff4c5d;
  --grey:#777d81;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.app{
  width:min(100%,760px);
  margin:auto;
  padding:18px 14px 45px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:22px;
}

.back{
  color:#c9ced1;
  text-decoration:none;
  font-size:25px;
  font-weight:800;
}

.logo{
  flex:1;
  font-size:22px;
  font-weight:950;
}

.logo span{color:var(--green)}

.auto-control{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:800;
}

.auto-box{
  width:30px;
  height:30px;
  border:2px solid #858b8f;
  border-radius:8px;
  background:#252a2d;
  display:grid;
  place-items:center;
}

.auto-box.on{
  background:var(--green);
  border-color:var(--green);
  color:#06150f;
}

.auto-box.on::after{
  content:"✓";
  font-size:19px;
  font-weight:1000;
}

h1{
  margin:0;
  text-align:center;
  font-size:30px;
}

.subtitle{
  margin:7px 0 20px;
  text-align:center;
  color:var(--muted);
}

.tuner{
  overflow:hidden;
  border:1px solid #ffffff12;
  border-radius:25px;
  background:var(--panel);
}

/* METER */

.meter{
  position:relative;
  height:220px;
  border-bottom:1px solid #ffffff10;
  background:
    linear-gradient(#ffffff07 1px,transparent 1px),
    linear-gradient(90deg,#ffffff07 1px,transparent 1px);
  background-size:32px 32px;
}

.track{
  position:absolute;
  left:8%;
  right:8%;
  top:75px;
  height:2px;
  background:#ffffff22;
}

.tick{
  position:absolute;
  top:59px;
  width:2px;
  height:34px;
  background:#e8e9e9;
}

.tick.big{
  top:48px;
  height:56px;
}

.target{
  position:absolute;
  left:50%;
  top:42px;
  transform:translateX(-50%);
  width:62px;
  height:68px;
  overflow:hidden;
  border:2px solid #a9adaf;
  border-radius:7px;
  background:#707579;
}

.fill{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:0;
  background:var(--green);
  transition:height .12s linear;
}

.center{
  position:absolute;
  left:50%;
  top:38px;
  width:3px;
  height:78px;
  transform:translateX(-50%);
  background:#fff;
  z-index:4;
}

.needle{
  position:absolute;
  left:50%;
  top:36px;
  width:5px;
  height:82px;
  transform:translateX(-50%);
  border-radius:4px;
  background:var(--grey);
  z-index:5;

  /*
    Smooth physical movement rather
    than jumping between readings.
  */
  transition:
    left .18s cubic-bezier(.22,.61,.36,1),
    background .14s ease;
}

.number{
  position:absolute;
  top:126px;
  left:50%;
  transform:translateX(-50%);
  font-size:36px;
  font-weight:950;
}

.instruction{
  position:absolute;
  top:174px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:17px;
  font-weight:850;
}

/* GUITAR */

.guitar{
  position:relative;
  width:min(100%,650px);
  height:370px;
  margin:12px auto 0;
}

.wood{
  position:absolute;
  left:6%;
  top:66px;
  width:72%;
  height:230px;

  clip-path:polygon(
    0 22%,
    8% 5%,
    64% 8%,
    80% 17%,
    100% 28%,
    100% 72%,
    80% 83%,
    64% 92%,
    8% 95%,
    0 78%
  );

  background:
    repeating-linear-gradient(
      1deg,
      rgba(255,255,255,.025) 0,
      rgba(255,255,255,.025) 2px,
      rgba(0,0,0,.035) 3px,
      rgba(0,0,0,.035) 5px
    ),
    linear-gradient(
      90deg,
      #623014,
      #a45b27 43%,
      #783b1a 78%,
      #4a2515
    );

  box-shadow:
    inset 0 0 38px #0008,
    0 15px 40px #0007;
}

.wood::after{
  content:"N";
  position:absolute;
  left:16%;
  top:50%;
  transform:translateY(-50%);
  color:#27130655;
  font-size:58px;
  font-weight:1000;
}

.neck{
  position:absolute;
  left:75%;
  right:0;
  top:126px;
  height:110px;
  background:linear-gradient(#38241a,#60402c 50%,#352219);
  box-shadow:inset 0 0 15px #0008;
  z-index:2;
}

.nut{
  position:absolute;
  left:75%;
  top:126px;
  width:8px;
  height:110px;
  background:#eee8dc;
  z-index:7;
}

.fret{
  position:absolute;
  top:126px;
  width:2px;
  height:110px;
  background:#b69b67;
  z-index:3;
}

.fret1{right:12%}
.fret2{right:4%}

/* STRINGS */

.string-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:8;
  pointer-events:none;
}

.guitar-string{
  fill:none;
  stroke:#c9cccd;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:stroke .15s,filter .15s;
}

.guitar-string.s2{stroke-width:1.9}
.guitar-string.s3{stroke-width:2.2}
.guitar-string.s4{stroke-width:2.5}
.guitar-string.s5{stroke-width:2.8}
.guitar-string.s6{stroke-width:3.2}

.guitar-string.bad{
  stroke:var(--red);
  filter:drop-shadow(0 0 5px var(--red));
}

.guitar-string.good{
  stroke:var(--green);
  filter:drop-shadow(0 0 6px var(--green));
}

/* PEGS */

.peg{
  position:absolute;
  width:44px;
  height:44px;
  border-radius:50%;
  z-index:10;
  border:2px solid #aeb2b4;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff 0,
      #daddde 18%,
      #8b9092 44%,
      #45494b 70%,
      #c5c8c9 73%,
      #55595b 100%
    );
}

.peg::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:13px;
  height:13px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#d8dbdc;
  border:2px solid #5c6062;
}

.p3{left:29%;top:83px}
.p2{left:45%;top:83px}
.p1{left:61%;top:83px}

.p4{left:29%;top:235px}
.p5{left:45%;top:235px}
.p6{left:61%;top:235px}

.peg.bad{
  border-color:var(--red);
  box-shadow:0 0 18px var(--red);
}

.peg.good{
  border-color:var(--green);
  box-shadow:0 0 18px var(--green);
}

/* BUTTONS */

.string-choice{
  position:absolute;
  width:55px;
  height:48px;
  border:2px solid #e3e5e6;
  border-radius:17px;
  background:#171c1f;
  color:#fff;
  font-size:20px;
  font-weight:900;
  z-index:12;
}

.c3{left:28.2%;top:27px}
.c2{left:44.2%;top:27px}
.c1{left:60.2%;top:27px}

.c4{left:28.2%;top:293px}
.c5{left:44.2%;top:293px}
.c6{left:60.2%;top:293px}

.string-choice.active{
  background:#fff;
  color:#14181a;
}

.string-choice.bad{
  background:var(--red);
  border-color:var(--red);
}

.string-choice.good{
  background:var(--green);
  border-color:var(--green);
  color:#061a12;
  box-shadow:0 0 19px #16d59a99;
}

.controls{
  padding:8px 18px 24px;
}

.start{
  width:100%;
  padding:16px;
  border:0;
  border-radius:16px;
  background:var(--green);
  color:#06150f;
  font-size:16px;
  font-weight:900;
}

.status{
  margin-top:13px;
  min-height:20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.complete{
  display:none;
  margin-top:14px;
  padding:14px;
  border:1px solid #16d59a66;
  border-radius:14px;
  background:#16d59a12;
  color:var(--green);
  text-align:center;
  font-weight:900;
}

@media(max-width:520px){
  .guitar{height:340px}
}
</style>
</head>

<script>

/* ========================================
   NOVA PRECISION TUNER
======================================== */

const GUITAR=[
 {number:6,label:"E",name:"Low E",hz:82.4069},
 {number:5,label:"A",name:"A",hz:110},
 {number:4,label:"D",name:"D",hz:146.8324},
 {number:3,label:"G",name:"G",hz:195.9977},
 {number:2,label:"B",name:"B",hz:246.9417},
 {number:1,label:"E",name:"High E",hz:329.6276}
];

const startButton=document.getElementById("start");
const autoBox=document.getElementById("autoBox");
const needle=document.getElementById("needle");
const numberDisplay=document.getElementById("number");
const instruction=document.getElementById("instruction");
const fill=document.getElementById("fill");
const status=document.getElementById("status");
const title=document.getElementById("title");
const complete=document.getElementById("complete");

const choiceButtons=[
 ...document.querySelectorAll(".string-choice")
];

let automatic=true;
let selectedString=null;

let audioContext=null;
let analyser=null;
let stream=null;
let buffer=null;
let running=false;

let pitchHistory=[];
let differenceHistory=[];
let autoHistory=[];

let displayedNeedle=0;

let stableStart=null;
let stableString=null;

let lastAnalysis=0;
let silenceFrames=0;

const tuned=new Set();

/* ========================================
   AUTO TOGGLE
======================================== */

function toggleAutomatic(){

 automatic=!automatic;

 autoBox.classList.toggle("on",automatic);

 autoBox.setAttribute(
   "aria-checked",
   automatic ? "true":"false"
 );

 selectedString=null;

 resetHistories();
 resetConfirmation();
 clearActive();

 title.textContent="Tune your guitar";

 if(automatic){

   instruction.textContent=
     running
     ?"Play any open string"
     :"Start tuning and play any string";

   status.textContent=
     "Automatic detection is on.";

 }else{

   instruction.textContent=
     "Choose a string to tune";

   status.textContent=
     "Choose E, A, D, G, B or E.";
 }
}

autoBox.addEventListener(
 "click",
 toggleAutomatic
);

/* ========================================
   MANUAL BUTTONS
======================================== */

choiceButtons.forEach(button=>{

 button.addEventListener("click",()=>{

   const number=
     Number(button.dataset.string);

   selectedString=
     GUITAR.find(
       s=>s.number===number
     );

   automatic=false;

   autoBox.classList.remove("on");

   autoBox.setAttribute(
     "aria-checked",
     "false"
   );

   resetHistories();
   resetConfirmation();
   clearActive();

   if(!tuned.has(number)){
     button.classList.add("active");
   }

   title.textContent=
     "Tune "+selectedString.name;

   instruction.textContent=
     "Play "+selectedString.name;

   status.textContent=
     "Listening for "+selectedString.name+".";
 });
});

/* ========================================
   MICROPHONE
======================================== */

startButton.addEventListener(
 "click",
 async()=>{

 if(running){
   stopTuner();
   return;
 }

 try{

   stream=
     await navigator.mediaDevices
     .getUserMedia({
       audio:{
         echoCancellation:false,
         noiseSuppression:false,
         autoGainControl:false,
         channelCount:1
       }
     });

   audioContext=
     new(
       window.AudioContext ||
       window.webkitAudioContext
     )();

   await audioContext.resume();

   const source=
     audioContext
     .createMediaStreamSource(stream);

   analyser=
     audioContext.createAnalyser();

   /*
     16384 is deliberate.

     Low E is ~82 Hz, so this gives
     enough waveform cycles to make
     its fundamental much more stable.
   */

   analyser.fftSize=16384;

   analyser.smoothingTimeConstant=0;

   buffer=
     new Float32Array(
       analyser.fftSize
     );

   source.connect(analyser);

   running=true;

   startButton.textContent=
     "Stop tuning";

   status.textContent=
     "Listening…";

   instruction.textContent=
     automatic
     ?"Play any open string"
     :selectedString
       ?"Play "+selectedString.name
       :"Choose a string to tune";

   requestAnimationFrame(listen);

 }catch(error){

   status.textContent=
     "Please allow microphone access.";
 }
});

function stopTuner(){

 running=false;

 if(stream){
   stream.getTracks().forEach(
     track=>track.stop()
   );
 }

 if(audioContext){
   audioContext.close();
 }

 stream=null;
 audioContext=null;

 startButton.textContent=
   "Start tuning";

 status.textContent=
   "Microphone is off.";
}

/* ========================================
   MAIN ANALYSIS LOOP
======================================== */

function listen(timestamp){

 if(!running)return;

 /*
   Around 12 measurements per second.

   Faster isn't automatically more
   accurate. Guitar strings vibrate
   and the attack of a pluck is messy.
 */

 if(timestamp-lastAnalysis>=80){

   lastAnalysis=timestamp;

   analyser.getFloatTimeDomainData(buffer);

   const volume=rms(buffer);

   if(volume>.0035){

     silenceFrames=0;

     const result=
       precisionPitch(
         buffer,
         audioContext.sampleRate
       );

     if(result){

       const stable=
         stabilisePitch(
           result.frequency,
           result.confidence
         );

       if(stable){

         if(automatic){
           processAutomatic(stable);
         }else if(selectedString){
           processManual(stable);
         }
       }
     }

   }else{

     silenceFrames++;

     /*
       Don't instantly destroy a good
       reading just because the string
       becomes quieter for one frame.
     */

     if(silenceFrames>5){
       resetConfirmation();
     }
   }
 }

 requestAnimationFrame(listen);
}

/* ========================================
   RMS
======================================== */

function rms(data){

 let sum=0;

 for(let i=0;i<data.length;i++){
   sum+=data[i]*data[i];
 }

 return Math.sqrt(
   sum/data.length
 );
}

/* ========================================
   PRECISION PITCH

   We run several YIN measurements
   over overlapping parts of the
   waveform.

   One bad estimate is discarded
   rather than becoming the answer.
======================================== */

function precisionPitch(data,sampleRate){

 const measurements=[];

 const windows=[
   {start:0,length:8192},
   {start:2048,length:8192},
   {start:4096,length:8192},
   {start:6144,length:8192}
 ];

 for(const window of windows){

   if(
     window.start+
     window.length>
     data.length
   ){
     continue;
   }

   const result=
     yinWindow(
       data,
       sampleRate,
       window.start,
       window.length
     );

   if(
     result &&
     result.confidence>.72
   ){
     measurements.push(result);
   }
 }

 if(measurements.length<2){
   return null;
 }

 /*
   Sort by frequency.
 */

 measurements.sort(
   (a,b)=>a.frequency-b.frequency
 );

 /*
   Median pitch rejects a single
   crazy +100 / -100 reading.
 */

 const middle=
   measurements[
     Math.floor(
       measurements.length/2
     )
   ];

 /*
   Check how closely the independent
   measurements agree.

   We compare them in musical pitch
   distance rather than raw Hz.
 */

 const close=
   measurements.filter(result=>{

     const difference=
       Math.abs(
         1200*
         Math.log2(
           result.frequency/
           middle.frequency
         )
       );

     return difference<12;
   });

 /*
   Require at least two windows to
   agree closely.
 */

 if(close.length<2){
   return null;
 }

 let weightedFrequency=0;
 let totalWeight=0;

 for(const result of close){

   const weight=
     result.confidence*
     result.confidence;

   weightedFrequency+=
     result.frequency*weight;

   totalWeight+=weight;
 }

 return{
   frequency:
     weightedFrequency/
     totalWeight,

   confidence:
     close.reduce(
       (sum,r)=>sum+r.confidence,
       0
     )/close.length
 };
}

/* ========================================
   YIN WINDOW
======================================== */

function yinWindow(
 data,
 sampleRate,
 start,
 length
){

 /*
   Wide enough to identify the wrong
   octave correctly too.
 */

 const minFrequency=65;
 const maxFrequency=400;

 const minTau=
   Math.floor(
     sampleRate/maxFrequency
   );

 const maxTau=
   Math.ceil(
     sampleRate/minFrequency
   );

 if(length<=maxTau*2){
   return null;
 }

 /*
   DC removal.
 */

 let mean=0;

 for(
   let i=start;
   i<start+length;
   i++
 ){
   mean+=data[i];
 }

 mean/=length;

 const usable=
   length-maxTau-1;

 const difference=
   new Float64Array(
     maxTau+1
   );

 /*
   Difference function.

   Step 2 keeps it practical on
   mobile while the large window
   maintains low-E resolution.
 */

 for(
   let tau=1;
   tau<=maxTau;
   tau++
 ){

   let sum=0;

   for(
     let i=0;
     i<usable;
     i+=2
   ){

     const a=
       data[start+i]-mean;

     const b=
       data[start+i+tau]-mean;

     const delta=a-b;

     sum+=delta*delta;
   }

   difference[tau]=sum;
 }

 /*
   Cumulative mean normalisation.
 */

 const cmnd=
   new Float64Array(
     maxTau+1
   );

 cmnd[0]=1;

 let runningSum=0;

 for(
   let tau=1;
   tau<=maxTau;
   tau++
 ){

   runningSum+=difference[tau];

   cmnd[tau]=
     runningSum===0
     ?1
     :difference[tau]*
      tau/
      runningSum;
 }

 /*
   First strong valley is important:
   this prevents high E being folded
   down into low E.
 */

 let tau=-1;

 const threshold=.12;

 for(
   let t=minTau;
   t<=maxTau;
   t++
 ){

   if(cmnd[t]<threshold){

     while(
       t+1<=maxTau &&
       cmnd[t+1]<cmnd[t]
     ){
       t++;
     }

     tau=t;
     break;
   }
 }

 /*
   Fallback for quieter strings.
 */

 if(tau<0){

   let bestValue=1;
   let bestTau=-1;

   for(
     let t=minTau;
     t<=maxTau;
     t++
   ){

     if(cmnd[t]<bestValue){

       bestValue=cmnd[t];
       bestTau=t;
     }
   }

   if(
     bestTau<0 ||
     bestValue>.25
   ){
     return null;
   }

   tau=bestTau;
 }

 /*
   Sub-sample interpolation.
 */

 let refinedTau=tau;

 if(
   tau>minTau &&
   tau<maxTau
 ){

   const left=cmnd[tau-1];
   const center=cmnd[tau];
   const right=cmnd[tau+1];

   const denominator=
     left-
     2*center+
     right;

   if(
     Math.abs(denominator)>
     0.0000001
   ){

     const shift=
       .5*
       (left-right)/
       denominator;

     if(
       Number.isFinite(shift) &&
       Math.abs(shift)<=1
     ){
       refinedTau+=shift;
     }
   }
 }

 const frequency=
   sampleRate/refinedTau;

 const confidence=
   1-cmnd[tau];

 if(
   !Number.isFinite(frequency) ||
   frequency<minFrequency ||
   frequency>maxFrequency
 ){
   return null;
 }

 return{
   frequency,
   confidence
 };
}

/* ========================================
   TEMPORAL STABILITY

   Reject sudden isolated jumps.
======================================== */

function stabilisePitch(
 frequency,
 confidence
){

 if(confidence<.70){
   return null;
 }

 pitchHistory.push({
   frequency,
   confidence
 });

 if(pitchHistory.length>7){
   pitchHistory.shift();
 }

 if(pitchHistory.length<3){
   return null;
 }

 /*
   Use median of the latest pitches.
 */

 const sorted=[
   ...pitchHistory
 ].sort(
   (a,b)=>
     a.frequency-b.frequency
 );

 const median=
   sorted[
     Math.floor(
       sorted.length/2
     )
   ].frequency;

 /*
   Keep readings within 10 of
   the median.

   This is the outlier filter.
 */

 const accepted=
   pitchHistory.filter(item=>{

     const distance=
       Math.abs(
         1200*
         Math.log2(
           item.frequency/
           median
         )
       );

     return distance<=10;
   });

 if(accepted.length<3){
   return null;
 }

 let weighted=0;
 let weights=0;

 for(const item of accepted){

   const w=
     item.confidence*
     item.confidence;

   weighted+=
     item.frequency*w;

   weights+=w;
 }

 return weighted/weights;
}

/* ========================================
   DIFFERENCE
======================================== */

function pitchDifference(
 frequency,
 target
){

 return(
   1200*
   Math.log2(
     frequency/target
   )
 );
}

/* ========================================
   MANUAL MODE
======================================== */

function processManual(pitch){

 const difference=
   pitchDifference(
     pitch,
     selectedString.hz
   );

 /*
   Wrong strings remain wrong.

   No octave folding.
 */

 const wrongPitch=
   Math.abs(difference)>100;

 showReading(
   selectedString,
   difference,
   wrongPitch
 );
}

/* ========================================
   AUTOMATIC
======================================== */

function processAutomatic(pitch){

 let best=null;
 let smallest=Infinity;

 for(const string of GUITAR){

   const difference=
     Math.abs(
       pitchDifference(
         pitch,
         string.hz
       )
     );

   if(difference<smallest){

     smallest=difference;
     best=string;
   }
 }

 if(!best || smallest>55){

   resetConfirmation();
   return;
 }

 autoHistory.push(best.number);

 if(autoHistory.length>6){
   autoHistory.shift();
 }

 const agreement=
   autoHistory.filter(
     n=>n===best.number
   ).length;

 if(agreement<4){
   return;
 }

 showReading(
   best,
   pitchDifference(
     pitch,
     best.hz
   ),
   false
 );
}

/* ========================================
   DISPLAY
======================================== */

function showReading(
 target,
 rawDifference,
 wrongPitch
){

 let difference=rawDifference;

 /*
   Only smooth readings belonging to
   the correct string.

   Wrong strings must not contaminate
   the next correct reading.
 */

 if(!wrongPitch){

   differenceHistory.push(
     rawDifference
   );

   if(differenceHistory.length>7){
     differenceHistory.shift();
   }

   const sorted=[
     ...differenceHistory
   ].sort((a,b)=>a-b);

   /*
     Median is more resistant to
     occasional pitch spikes than
     a normal average.
   */

   difference=
     sorted[
       Math.floor(
         sorted.length/2
       )
     ];

 }else{

   differenceHistory=[];
   resetConfirmation();
 }

 const rounded=
   Math.round(difference);

 numberDisplay.textContent=
   rounded>0
   ?"+"+rounded
   :String(rounded);

 /*
   Smooth needle independently.

   Actual pitch number remains based
   on the filtered measurement.
 */

 const needleTarget=
   Math.max(
     -50,
     Math.min(
       50,
       difference
     )
   );

 displayedNeedle=
   displayedNeedle+
   (
     needleTarget-
     displayedNeedle
   )*.32;

 needle.style.left=
   (
     50+
     (displayedNeedle/50)*42
   )+"%";

 title.textContent=
   "Tune "+target.name;

 clearActive();

 const button=
   buttonFor(target.number);

 if(!tuned.has(target.number)){
   button.classList.add("active");
 }

 if(wrongPitch){

   needle.style.background=
     "var(--red)";

   numberDisplay.style.color=
     "var(--red)";

   instruction.style.color=
     "var(--red)";

   instruction.textContent=
     difference<0
     ?"Much too low"
     :"Much too high";

   setBad(target.number);

   return;
 }

 clearBad(target.number);

 const amount=
   Math.abs(difference);

 /*
   PRECISION ZONES

   0–2 = green
   3–4 = yellow
   5+  = red
 */

 if(amount<=2){

   needle.style.background=
     "var(--green)";

   numberDisplay.style.color=
     "var(--green)";

   instruction.style.color=
     "var(--green)";

   instruction.textContent=
     "Hold steady";

   confirmTuning(
     target,
     difference
   );

 }else if(amount<=4){

   resetConfirmation();

   needle.style.background=
     "var(--yellow)";

   numberDisplay.style.color=
     "var(--yellow)";

   instruction.style.color=
     "var(--yellow)";

   instruction.textContent=
     difference<0
     ?"Tune up"
     :"Tune down";

 }else{

   resetConfirmation();

   needle.style.background=
     "var(--red)";

   numberDisplay.style.color=
     "var(--red)";

   instruction.style.color=
     "var(--red)";

   instruction.textContent=
     difference<0
     ?"Tune up"
     :"Tune down";
 }
}

/* ========================================
   CONFIRMATION
======================================== */

function confirmTuning(
 target,
 difference
){

 if(Math.abs(difference)>2){

   resetConfirmation();
   return;
 }

 if(tuned.has(target.number)){

   fill.style.height="100%";

   instruction.textContent=
     "In tune ✓";

   return;
 }

 if(stableString!==target.number){

   stableString=
     target.number;

   stableStart=
     performance.now();

   fill.style.height="0%";
 }

 const elapsed=
   performance.now()-
   stableStart;

 /*
   2 seconds of stable pitch.
 */

 const progress=
   Math.min(
     1,
     elapsed/2000
   );

 fill.style.height=
   (progress*100)+"%";

 if(progress>=1){

   markTuned(target);

   stableStart=null;
   stableString=null;
 }
}

function resetConfirmation(){

 stableStart=null;
 stableString=null;

 fill.style.height="0%";
}

/* ========================================
   MARK TUNED
======================================== */

function markTuned(target){

 tuned.add(target.number);

 const button=
   buttonFor(target.number);

 const peg=
   document.getElementById(
     "peg"+target.number
   );

 const string=
   document.getElementById(
     "string"+target.number
   );

 button.classList.remove(
   "active",
   "bad"
 );

 peg.classList.remove("bad");
 string.classList.remove("bad");

 button.classList.add("good");
 peg.classList.add("good");
 string.classList.add("good");

 fill.style.height="100%";

 numberDisplay.textContent="0";

 numberDisplay.style.color=
   "var(--green)";

 instruction.textContent=
   "In tune ✓";

 instruction.style.color=
   "var(--green)";

 status.textContent=
   target.name+" is tuned.";

 if(tuned.size===6){

   complete.style.display="block";

   title.textContent=
     "Guitar tuned ✓";
 }
}

/* ========================================
   VISUAL STATES
======================================== */

function setBad(number){

 if(tuned.has(number)){
   return;
 }

 const button=buttonFor(number);

 const peg=
   document.getElementById(
     "peg"+number
   );

 const string=
   document.getElementById(
     "string"+number
   );

 button.classList.remove("active");

 button.classList.add("bad");
 peg.classList.add("bad");
 string.classList.add("bad");
}

function clearBad(number){

 if(tuned.has(number)){
   return;
 }

 const button=buttonFor(number);

 const peg=
   document.getElementById(
     "peg"+number
   );

 const string=
   document.getElementById(
     "string"+number
   );

 button.classList.remove("bad");
 peg.classList.remove("bad");
 string.classList.remove("bad");
}

function buttonFor(number){

 return document.querySelector(
   '.string-choice[data-string="'+
   number+
   '"]'
 );
}

function clearActive(){

 choiceButtons.forEach(button=>{

   const number=
     Number(button.dataset.string);

   if(!tuned.has(number)){
     button.classList.remove("active");
   }
 });
}

function resetHistories(){

 pitchHistory=[];
 differenceHistory=[];
 autoHistory=[];

 displayedNeedle=0;
}

/*
  Nothing is saved.

  Refreshing or leaving the page
  starts a completely new tuning
  session.
*/

</script>
