<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d12">

<title>Nova Guitar AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#090d12;
  --panel:#101720;
  --panel2:#151e2b;
  --line:rgba(255,255,255,.09);
  --text:#f7f9fb;
  --muted:#8996a7;
  --green:#18e7a1;
  --greenSoft:rgba(24,231,161,.12);
  --danger:#ff7474;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{overflow:hidden}

button,textarea,input{font:inherit}
button{cursor:pointer}

.app{
  height:100dvh;
  max-width:760px;
  margin:auto;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 18% 0%,rgba(80,80,255,.22),transparent 27%),
    radial-gradient(circle at 86% 0%,rgba(0,225,165,.15),transparent 25%),
    var(--bg);
}

/* HEADER */

.header{
  flex:0 0 auto;
  padding:max(14px,env(safe-area-inset-top)) 16px 12px;
  border-bottom:1px solid var(--line);
  background:rgba(9,13,18,.88);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  z-index:20;
}

.headerRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.iconButton{
  width:46px;
  height:46px;
  border:1px solid var(--line);
  border-radius:15px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.045);
  color:white;
  font-size:23px;
}

.brand{text-align:center}

.brandName{
  font-size:17px;
  font-weight:900;
}

.brandName span{color:var(--green)}

.online{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.onlineDot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:5px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 145px;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{display:none}

.intro{
  padding:8px 5px 20px;
}

.aiIdentity{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:26px;
  color:#04130e;
  background:linear-gradient(145deg,#7b72ff,var(--green));
  box-shadow:0 0 0 3px rgba(255,255,255,.06);
}

.aiTitle{
  font-size:20px;
  font-weight:900;
}

.aiSubtitle{
  margin-top:3px;
  color:var(--muted);
  font-size:13px;
}

.intro h1{
  margin:0;
  font-size:clamp(31px,8vw,46px);
  line-height:1.05;
  letter-spacing:-1.4px;
}

.intro h1 span{color:var(--green)}

.introText{
  margin-top:13px;
  max-width:600px;
  color:#c7d0da;
  font-size:16px;
  line-height:1.55;
}

/* MESSAGES */

.messageRow{
  display:flex;
  margin:14px 0;
}

.messageRow.user{
  justify-content:flex-end;
}

.messageRow.nova{
  justify-content:flex-start;
}

.message{
  max-width:88%;
  padding:13px 15px;
  border-radius:20px;
  font-size:16px;
  line-height:1.48;
  white-space:pre-wrap;
  word-break:break-word;
}

.messageRow.nova .message{
  background:var(--panel);
  border:1px solid var(--line);
  border-bottom-left-radius:6px;
}

.messageRow.user .message{
  background:var(--green);
  color:#06140f;
  font-weight:650;
  border-bottom-right-radius:6px;
}

.novaLabel{
  margin:18px 0 7px 3px;
  color:var(--muted);
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

/* SUGGESTIONS */

.suggestions{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:5px 2px 12px;
}

.suggestions::-webkit-scrollbar{display:none}

.suggestion{
  flex:0 0 auto;
  padding:11px 14px;
  border:1px solid rgba(24,231,161,.28);
  border-radius:999px;
  background:var(--greenSoft);
  color:#dffbf2;
  font-size:14px;
  font-weight:750;
  white-space:nowrap;
}

/* THINKING */

.thinking{
  display:inline-flex;
  gap:5px;
}

.thinking i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--muted);
  animation:pulse 1s infinite;
}

.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}

@keyframes pulse{
  0%,60%,100%{opacity:.3;transform:translateY(0)}
  30%{opacity:1;transform:translateY(-3px)}
}

/* COMPOSER */

.composerArea{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:10px 13px max(12px,env(safe-area-inset-bottom));
  background:
    linear-gradient(
      transparent,
      rgba(9,13,18,.97) 24%,
      var(--bg) 55%
    );
  z-index:30;
}

.composer{
  min-height:60px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:7px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:25px;
  background:#111925;
}

textarea{
  flex:1;
  min-height:44px;
  max-height:130px;
  resize:none;
  padding:11px 9px 8px;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:16px;
}

textarea::placeholder{color:#69778b}

.composerButton{
  width:46px;
  height:46px;
  flex:0 0 auto;
  border:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:20px;
}

.mic{
  color:var(--green);
  background:rgba(24,231,161,.10);
}

.send{
  background:var(--green);
  color:#06140f;
  font-size:22px;
  font-weight:950;
}

.send:disabled{opacity:.35}

/* MENU DRAWER */

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.58);
  opacity:0;
  pointer-events:none;
  transition:.22s;
  z-index:50;
}

.overlay.open{
  opacity:1;
  pointer-events:auto;
}

.drawer{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:min(88%,370px);
  padding:max(20px,env(safe-area-inset-top)) 14px 25px;
  background:#0d131b;
  border-right:1px solid var(--line);
  transform:translateX(-102%);
  transition:.25s ease;
  z-index:60;
  overflow-y:auto;
}

.drawer.open{
  transform:translateX(0);
}

.drawerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.drawerTitle{
  font-size:27px;
  font-weight:900;
}

.closeDrawer{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:#18212d;
  color:white;
  font-size:21px;
}

.accountCard{
  padding:13px 14px;
  margin-bottom:13px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#111923;
}

.accountSmall{
  color:var(--muted);
  font-size:10px;
  font-weight:850;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.accountName{
  margin-top:5px;
  font-size:15px;
  font-weight:850;
}

.menuButton{
  width:100%;
  min-height:51px;
  margin-bottom:8px;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#131b25;
  color:white;
  text-align:left;
  font-weight:800;
}

.menuButton.primary{
  border-color:rgba(24,231,161,.38);
  background:var(--greenSoft);
  color:var(--green);
}

.menuButton.logout{
  color:var(--danger);
}

.divider{
  height:1px;
  margin:17px 0;
  background:var(--line);
}

.historyHeading{
  margin:8px 4px 10px;
  color:var(--muted);
  font-size:12px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.historyItem{
  width:100%;
  text-align:left;
  padding:13px;
  margin-bottom:7px;
  border:1px solid transparent;
  border-radius:14px;
  background:#131b25;
  color:white;
}

.historyItem.active{
  border-color:rgba(24,231,161,.35);
  background:rgba(24,231,161,.08);
}

.historyTitle{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:800;
}

.historyDate{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.emptyHistory{
  padding:20px 8px;
  color:var(--muted);
  text-align:center;
  line-height:1.5;
}

</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="headerRow">

    <button
      class="iconButton"
      id="menuButton"
      aria-label="Open menu"
    >
      ☰
    </button>

    <div class="brand">

      <div class="brandName">
        NOVA <span>GUITAR AI</span>
      </div>

      <div class="online">
        <span class="onlineDot"></span>
        AI online
      </div>

    </div>

    <button
      class="iconButton"
      id="instrumentButton"
      aria-label="Choose instrument"
    >
      ♫
    </button>

  </div>

</header>


<main class="chat" id="chat">

<section class="intro">

  <div class="aiIdentity">

    <div class="avatar">♪</div>

    <div>
      <div class="aiTitle">Nova</div>

      <div class="aiSubtitle">
        Your personal guitar AI
      </div>
    </div>

  </div>


  <h1>
    What do you want to
    <span>play?</span>
  </h1>


  <div class="introText">
    Talk naturally with Nova.
    Ask about chords, songs, technique,
    theory, practice or anything you're
    trying to understand.
  </div>

</section>


<div id="conversation"></div>


<div class="suggestions" id="suggestions">

  <button
    class="suggestion"
    data-prompt="I'm a complete beginner"
  >
    I'm a beginner
  </button>

  <button
    class="suggestion"
    data-prompt="Teach me a guitar chord"
  >
    Learn a chord
  </button>

  <button
    class="suggestion"
    data-prompt="Give me a practice session"
  >
    Start practice
  </button>

  <button
    class="suggestion"
    data-prompt="Help me learn a song"
  >
    Learn a song
  </button>

</div>

</main>


<div class="composerArea">

  <div class="composer">

    <button
      class="composerButton mic"
      id="micButton"
      aria-label="Voice"
    >
      🎙
    </button>

    <textarea
      id="input"
      rows="1"
      placeholder="Message Nova..."
    ></textarea>

    <button
      class="composerButton send"
      id="sendButton"
      disabled
    >
      ↑
    </button>

  </div>

</div>


<div class="overlay" id="overlay"></div>


<aside class="drawer" id="drawer">

  <div class="drawerTop">

    <div class="drawerTitle">
      Nova
    </div>

    <button
      class="closeDrawer"
      id="closeDrawer"
      aria-label="Close menu"
    >
      ×
    </button>

  </div>


  <div class="accountCard">

    <div class="accountSmall">
      Signed in
    </div>

    <div
      class="accountName"
      id="accountName"
    >
      Nova musician
    </div>

  </div>


  <button
    class="menuButton primary"
    id="newChatButton"
  >
    ＋ New chat
  </button>


  <button
    class="menuButton"
    id="chooseInstrumentButton"
  >
    ♫ Choose instrument
  </button>


  <button
    class="menuButton"
    id="profileButton"
  >
    Profile
  </button>


  <button
    class="menuButton"
    id="settingsButton"
  >
    Settings
  </button>


  <button
    class="menuButton logout"
    id="logoutButton"
  >
    Log out
  </button>


  <div class="divider"></div>


  <div class="historyHeading">
    Recent chats
  </div>


  <div id="historyList"></div>

</aside>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const novaSupabase =
  supabase.createClient(
    "https://docyfgbghwncylldlcfs.supabase.co",
    "sb_publishable_9m_olDXjv4gjSWklXvhg-g_vDwcbBRk",
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true
      }
    }
  );


/* ==========================================
   NOVA
========================================== */

const NOVA_API =
  "https://nova-guitar-ai.kb6cj2ktgc.workers.dev";


let STORAGE_KEY =
  "nova_guitar_chats_v2";


let chats = [];

let currentChatId = null;

let waitingForNova = false;

let learnerName = "";


/* ==========================================
   ELEMENTS
========================================== */

const conversation =
  document.getElementById("conversation");

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const sendButton =
  document.getElementById("sendButton");

const suggestions =
  document.getElementById("suggestions");

const menuButton =
  document.getElementById("menuButton");

const drawer =
  document.getElementById("drawer");

const overlay =
  document.getElementById("overlay");

const closeDrawer =
  document.getElementById("closeDrawer");

const historyList =
  document.getElementById("historyList");

const newChatButton =
  document.getElementById("newChatButton");

const chooseInstrumentButton =
  document.getElementById("chooseInstrumentButton");

const instrumentButton =
  document.getElementById("instrumentButton");

const profileButton =
  document.getElementById("profileButton");

const settingsButton =
  document.getElementById("settingsButton");

const logoutButton =
  document.getElementById("logoutButton");

const accountName =
  document.getElementById("accountName");

const micButton =
  document.getElementById("micButton");


/* ==========================================
   AUTHENTICATION
========================================== */

async function startNova(){

  const {
    data:{user},
    error
  } =
    await novaSupabase.auth.getUser();


  if(error || !user){

    window.location.replace(
      "login.html"
    );

    return;
  }


  /*
    Each account gets separate browser chat history.
  */

  STORAGE_KEY =
    "nova_guitar_chats_v2_" +
    user.id;


  let profile = null;


  try{

    const result =
      await novaSupabase
        .from("profiles")
        .select("display_name,username")
        .eq("id",user.id)
        .single();


    profile =
      result.data;

  }catch(error){

    console.warn(
      "Profile unavailable",
      error
    );
  }


  const fullName =
    profile?.display_name ||
    user.user_metadata?.display_name ||
    profile?.username ||
    "Nova musician";


  learnerName =
    fullName
      .trim()
      .split(/\s+/)[0];


  accountName.textContent =
    fullName;


  chats =
    loadChats();


  if(chats.length){

    chats.sort(
      (a,b) =>
        b.updatedAt -
        a.updatedAt
    );

    currentChatId =
      chats[0].id;

    renderCurrentChat();

  }else{

    createChat();
  }


  renderHistory();
}


/* ==========================================
   CHAT STORAGE
========================================== */

function loadChats(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(!saved){
      return [];
    }


    const parsed =
      JSON.parse(saved);


    return Array.isArray(parsed)
      ? parsed
      : [];

  }catch(error){

    return [];
  }
}


function saveChats(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(chats)
    );

  }catch(error){

    console.warn(
      "Nova couldn't save chats.",
      error
    );
  }


  renderHistory();
}


/* ==========================================
   NEW CHAT
========================================== */

function createChat(){

  const chatObject = {

    id:
      "chat_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,8),

    title:
      "New guitar chat",

    createdAt:
      Date.now(),

    updatedAt:
      Date.now(),

    messages:[]
  };


  chats.unshift(
    chatObject
  );


  currentChatId =
    chatObject.id;


  saveChats();

  renderCurrentChat();

  closeMenu();

  input.focus();
}


/* ==========================================
   CURRENT CHAT
========================================== */

function getCurrentChat(){

  return chats.find(
    item =>
      item.id === currentChatId
  );
}


/* ==========================================
   CHAT TITLE
========================================== */

function makeChatTitle(text){

  let clean =
    text
      .replace(/\s+/g," ")
      .trim();


  if(clean.length > 34){

    clean =
      clean.slice(0,34).trim() +
      "…";
  }


  return clean ||
    "Guitar chat";
}


/* ==========================================
   SAVE MESSAGE
========================================== */

function storeMessage(
  role,
  content
){

  const active =
    getCurrentChat();


  if(!active){
    return;
  }


  active.messages.push({
    role,
    content,
    time:Date.now()
  });


  active.updatedAt =
    Date.now();


  if(
    role === "user" &&
    active.messages.filter(
      message =>
        message.role === "user"
    ).length === 1
  ){

    active.title =
      makeChatTitle(
        content
      );
  }


  chats.sort(
    (a,b) =>
      b.updatedAt -
      a.updatedAt
  );


  saveChats();
}


/* ==========================================
   SEND MESSAGE
========================================== */

function sendCurrentMessage(){

  const text =
    input.value.trim();


  if(
    !text ||
    waitingForNova
  ){
    return;
  }


  input.value = "";

  resizeInput();

  sendButton.disabled =
    true;


  sendUserMessage(
    text
  );
}


async function sendUserMessage(text){

  if(waitingForNova){
    return;
  }


  if(!currentChatId){
    createChat();
  }


  storeMessage(
    "user",
    text
  );


  renderCurrentChat();

  showThinking();

  scrollToBottom();


  waitingForNova =
    true;


  sendButton.disabled =
    true;


  try{

    const active =
      getCurrentChat();


    const messages =
      active.messages
        .slice(-30)
        .filter(
          message =>
            message.role === "user" ||
            message.role === "assistant"
        )
        .map(
          message => ({
            role:
              message.role,

            content:
              message.content
          })
        );


    const response =
      await fetch(
        NOVA_API,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              messages,
              learnerName
            })
        }
      );


    let data = null;


    try{

      data =
        await response.json();

    }catch(error){

      throw new Error(
        "Unreadable response"
      );
    }


    if(!response.ok){

      throw new Error(
        data?.error ||
        "Nova couldn't answer."
      );
    }


    const reply =
      typeof data?.reply === "string"
        ? data.reply.trim()
        : "";


    if(!reply){

      throw new Error(
        "Nova returned no reply."
      );
    }


    removeThinking();


    storeMessage(
      "assistant",
      reply
    );


    renderCurrentChat();

    scrollToBottom();


  }catch(error){

    console.error(
      "Nova AI error:",
      error
    );


    removeThinking();


    storeMessage(
      "assistant",
      "I couldn't connect to Nova AI just now. Please try sending that message again."
    );


    renderCurrentChat();

    scrollToBottom();

  }finally{

    waitingForNova =
      false;


    sendButton.disabled =
      !input.value.trim();
  }
}


/* ==========================================
   RENDER CHAT
========================================== */

function renderCurrentChat(){

  conversation.innerHTML =
    "";


  const active =
    getCurrentChat();


  if(
    !active ||
    active.messages.length === 0
  ){

    suggestions.style.display =
      "flex";

    return;
  }


  suggestions.style.display =
    "none";


  active.messages.forEach(
    message => {

      renderMessage(
        message.role,
        message.content
      );
    }
  );


  scrollToBottom();
}


function renderMessage(
  role,
  text
){

  const sender =
    role === "assistant"
      ? "nova"
      : "user";


  if(sender === "nova"){

    const label =
      document.createElement(
        "div"
      );


    label.className =
      "novaLabel";


    label.textContent =
      "Nova";


    conversation.appendChild(
      label
    );
  }


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "messageRow " +
    sender;


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "message";


  bubble.textContent =
    text;


  row.appendChild(
    bubble
  );


  conversation.appendChild(
    row
  );
}


/* ==========================================
   THINKING
========================================== */

function showThinking(){

  removeThinking();


  const label =
    document.createElement(
      "div"
    );


  label.className =
    "novaLabel";


  label.id =
    "thinkingLabel";


  label.textContent =
    "Nova";


  conversation.appendChild(
    label
  );


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "messageRow nova";


  row.id =
    "thinkingRow";


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "message";


  bubble.innerHTML =
    '<span class="thinking">' +
    '<i></i><i></i><i></i>' +
    '</span>';


  row.appendChild(
    bubble
  );


  conversation.appendChild(
    row
  );
}


function removeThinking(){

  const row =
    document.getElementById(
      "thinkingRow"
    );


  const label =
    document.getElementById(
      "thinkingLabel"
    );


  if(row){
    row.remove();
  }


  if(label){
    label.remove();
  }
}


/* ==========================================
   HISTORY
========================================== */

function renderHistory(){

  historyList.innerHTML =
    "";


  if(!chats.length){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "emptyHistory";


    empty.textContent =
      "Your Nova conversations will appear here.";


    historyList.appendChild(
      empty
    );


    return;
  }


  chats
    .sort(
      (a,b) =>
        b.updatedAt -
        a.updatedAt
    )
    .forEach(
      item => {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "historyItem";


        if(
          item.id ===
          currentChatId
        ){

          button.classList.add(
            "active"
          );
        }


        const title =
          document.createElement(
            "div"
          );


        title.className =
          "historyTitle";


        title.textContent =
          item.title;


        const date =
          document.createElement(
            "div"
          );


        date.className =
          "historyDate";


        date.textContent =
          formatDate(
            item.updatedAt
          );


        button.appendChild(
          title
        );


        button.appendChild(
          date
        );


        button.addEventListener(
          "click",
          () => {

            currentChatId =
              item.id;


            renderCurrentChat();

            renderHistory();

            closeMenu();
          }
        );


        historyList.appendChild(
          button
        );
      }
    );
}


/* ==========================================
   DATE
========================================== */

function formatDate(timestamp){

  const date =
    new Date(timestamp);


  const today =
    new Date();


  if(
    date.toDateString() ===
    today.toDateString()
  ){

    return (
      "Today • " +
      date.toLocaleTimeString(
        [],
        {
          hour:"numeric",
          minute:"2-digit"
        }
      )
    );
  }


  return date.toLocaleDateString(
    [],
    {
      day:"numeric",
      month:"short"
    }
  );
}


/* ==========================================
   MENU
========================================== */

function openMenu(){

  renderHistory();


  drawer.classList.add(
    "open"
  );


  overlay.classList.add(
    "open"
  );
}


function closeMenu(){

  drawer.classList.remove(
    "open"
  );


  overlay.classList.remove(
    "open"
  );
}


menuButton.addEventListener(

closeDrawer.addEventListener(

);


overlay.addEventListener(

);

/* ==========================================
   LOG OUT
========================================== */

logoutButton.addEventListener(
  "click",
  async () => {

    logoutButton.disabled =
      true;


    logoutButton.textContent =
      "Logging out…";


    try{

      const {error} =
        await novaSupabase
          .auth
          .signOut({
            scope:"local"
          });


      if(error){
        throw error;
      }


      /*
        We keep this account's local chat history.

        Because the storage key includes the user's
        permanent Supabase ID, another account on
        this phone will not use the same chat history.
      */


      window.location.replace(
        "index.html"
      );


    }catch(error){

      console.error(
        "Logout failed:",
        error
      );


      logoutButton.disabled =
        false;


      logoutButton.textContent =
        "Log out";


      alert(
        "We couldn't log you out. Please try again."
      );
    }
  }
);


/* ==========================================
   SUGGESTIONS
========================================== */

document
  .querySelectorAll(
    ".suggestion"
  )
  .forEach(
    button => {

      button.addEventListener(

        }
      );

  );


/* ==========================================
   INPUT
========================================== */

input.addEventListener(
  "input",
  () => {

    resizeInput();


    sendButton.disabled =
      waitingForNova ||
      !input.value.trim();
  }
);


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendCurrentMessage();
    }
  }
);


sendButton.addEventListener(
  "click",
  sendCurrentMessage
);

   MICROPHONE PLACEHOLDER
========================================== */

micButton.addEventListener(
  "click",
  () => {

    if(!currentChatId){
      createChat();
    }


    storeMessage(
      "assistant",
      "Voice and guitar listening are coming later. For now, type your message to me."
    );


    renderCurrentChat();
  }
);


/* ==========================================
   TEXTAREA
========================================== */

function resizeInput(){

  input.style.height =
    "auto";


  input.style.height =
    Math.min(
      input.scrollHeight,
      130
    ) + "px";
}


/* ==========================================
   SCROLL
========================================== */

function scrollToBottom(){

  requestAnimationFrame(
    () => {

      chat.scrollTo({
        top:chat.scrollHeight,
        behavior:"smooth"
      });
    }
  );
}


/* ==========================================
   START
========================================== */

startNova();
