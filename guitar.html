<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101416">

<title>Nova Musical — Guitar Tuner</title>

<style>
:root{
  --bg:#101416;
  --panel:#171c1f;
  --white:#f7f7f7;
  --muted:#8c9297;
  --green:#16d59a;
  --yellow:#e5d84c;
  --red:#ff4c5d;
  --grey:#777d81;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.app{
  width:min(100%,760px);
  margin:auto;
  padding:18px 14px 45px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:22px;
}

.back{
  color:#c9ced1;
  text-decoration:none;
  font-size:25px;
  font-weight:800;
}

.logo{
  flex:1;
  font-size:22px;
  font-weight:950;
}

.logo span{color:var(--green)}

.auto-control{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:800;
}

.auto-box{
  width:30px;
  height:30px;
  border:2px solid #858b8f;
  border-radius:8px;
  background:#252a2d;
  display:grid;
  place-items:center;
}

.auto-box.on{
  background:var(--green);
  border-color:var(--green);
  color:#06150f;
}

.auto-box.on::after{
  content:"✓";
  font-size:19px;
  font-weight:1000;
}

h1{
  margin:0;
  text-align:center;
  font-size:30px;
}

.subtitle{
  margin:7px 0 20px;
  text-align:center;
  color:var(--muted);
}

.tuner{
  overflow:hidden;
  border:1px solid #ffffff12;
  border-radius:25px;
  background:var(--panel);
}

/* =========================
   METER
========================= */

.meter{
  position:relative;
  height:220px;
  border-bottom:1px solid #ffffff10;

  background:
    linear-gradient(#ffffff07 1px,transparent 1px),
    linear-gradient(90deg,#ffffff07 1px,transparent 1px);

  background-size:32px 32px;
}

.track{
  position:absolute;
  left:8%;
  right:8%;
  top:75px;
  height:2px;
  background:#ffffff22;
}

.tick{
  position:absolute;
  top:59px;
  width:2px;
  height:34px;
  background:#e8e9e9;
}

.tick.big{
  top:48px;
  height:56px;
}

.target{
  position:absolute;
  left:50%;
  top:42px;
  transform:translateX(-50%);
  width:62px;
  height:68px;
  overflow:hidden;
  border:2px solid #a9adaf;
  border-radius:7px;
  background:#707579;
}

.fill{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:0;
  background:var(--green);
  transition:height .08s linear;
}

.center{
  position:absolute;
  left:50%;
  top:38px;
  width:3px;
  height:78px;
  transform:translateX(-50%);
  background:#fff;
  z-index:4;
}

.needle{
  position:absolute;
  left:50%;
  top:36px;
  width:5px;
  height:82px;
  transform:translateX(-50%);
  border-radius:4px;
  background:var(--grey);
  z-index:5;
  transition:left .07s linear,background .1s;
}

.number{
  position:absolute;
  top:126px;
  left:50%;
  transform:translateX(-50%);
  font-size:36px;
  font-weight:950;
}

.instruction{
  position:absolute;
  top:174px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:17px;
  font-weight:850;
}

/* =========================
   GUITAR
========================= */

.guitar{
  position:relative;
  width:min(100%,650px);
  height:370px;
  margin:12px auto 0;
}

.wood{
  position:absolute;
  left:6%;
  top:66px;
  width:72%;
  height:230px;

  clip-path:polygon(
    0 22%,
    8% 5%,
    64% 8%,
    80% 17%,
    100% 28%,
    100% 72%,
    80% 83%,
    64% 92%,
    8% 95%,
    0 78%
  );

  background:
    repeating-linear-gradient(
      1deg,
      rgba(255,255,255,.025) 0,
      rgba(255,255,255,.025) 2px,
      rgba(0,0,0,.035) 3px,
      rgba(0,0,0,.035) 5px
    ),
    linear-gradient(
      90deg,
      #623014,
      #a45b27 43%,
      #783b1a 78%,
      #4a2515
    );

  box-shadow:
    inset 0 0 38px #0008,
    0 15px 40px #0007;
}

.wood::after{
  content:"N";
  position:absolute;
  left:16%;
  top:50%;
  transform:translateY(-50%);
  color:#27130655;
  font-size:58px;
  font-weight:1000;
}

.neck{
  position:absolute;
  left:75%;
  right:0;
  top:126px;
  height:110px;

  background:
    linear-gradient(
      #38241a,
      #60402c 50%,
      #352219
    );

  box-shadow:inset 0 0 15px #0008;
  z-index:2;
}

.nut{
  position:absolute;
  left:75%;
  top:126px;
  width:8px;
  height:110px;
  background:#eee8dc;
  z-index:7;
}

.fret{
  position:absolute;
  top:126px;
  width:2px;
  height:110px;
  background:#b69b67;
  z-index:3;
}

.fret1{right:12%}
.fret2{right:4%}

/* =========================
   STRINGS
========================= */

.string-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:8;
  pointer-events:none;
}

.guitar-string{
  fill:none;
  stroke:#c9cccd;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:stroke .12s,stroke-width .12s,filter .12s;
}

.guitar-string.s2{stroke-width:1.9}
.guitar-string.s3{stroke-width:2.2}
.guitar-string.s4{stroke-width:2.5}
.guitar-string.s5{stroke-width:2.8}
.guitar-string.s6{stroke-width:3.2}

.guitar-string.bad{
  stroke:var(--red);
  stroke-width:5;
  filter:drop-shadow(0 0 5px var(--red));
}

.guitar-string.good{
  stroke:var(--green);
  stroke-width:5;
  filter:drop-shadow(0 0 6px var(--green));
}

/* =========================
   PEGS
========================= */

.peg{
  position:absolute;
  width:44px;
  height:44px;
  border-radius:50%;
  z-index:10;
  border:2px solid #aeb2b4;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff 0,
      #daddde 18%,
      #8b9092 44%,
      #45494b 70%,
      #c5c8c9 73%,
      #55595b 100%
    );
}

.peg::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:13px;
  height:13px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#d8dbdc;
  border:2px solid #5c6062;
}

.p3{left:29%;top:83px}
.p2{left:45%;top:83px}
.p1{left:61%;top:83px}

.p4{left:29%;top:235px}
.p5{left:45%;top:235px}
.p6{left:61%;top:235px}

.peg.bad{
  border-color:var(--red);
  box-shadow:0 0 18px var(--red);
}

.peg.good{
  border-color:var(--green);
  box-shadow:0 0 18px var(--green);
}

/* =========================
   STRING BUTTONS
========================= */

.string-choice{
  position:absolute;
  width:55px;
  height:48px;
  border:2px solid #e3e5e6;
  border-radius:17px;
  background:#171c1f;
  color:#fff;
  font-size:20px;
  font-weight:900;
  z-index:12;
}

.c3{left:28.2%;top:27px}
.c2{left:44.2%;top:27px}
.c1{left:60.2%;top:27px}

.c4{left:28.2%;top:293px}
.c5{left:44.2%;top:293px}
.c6{left:60.2%;top:293px}

.string-choice.active{
  background:#fff;
  color:#14181a;
  box-shadow:0 0 22px #ffffff8c;
}

.string-choice.bad{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
  box-shadow:0 0 19px var(--red);
}

.string-choice.good{
  background:var(--green);
  border-color:var(--green);
  color:#061a12;
  box-shadow:0 0 19px #16d59a99;
}

/* =========================
   CONTROLS
========================= */

.controls{
  padding:8px 18px 24px;
}

.start{
  width:100%;
  padding:16px;
  border:0;
  border-radius:16px;
  background:var(--green);
  color:#06150f;
  font-size:16px;
  font-weight:900;
}

.status{
  margin-top:13px;
  min-height:20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.complete{
  display:none;
  margin-top:14px;
  padding:14px;
  border:1px solid #16d59a66;
  border-radius:14px;
  background:#16d59a12;
  color:var(--green);
  text-align:center;
  font-weight:900;
}

@media(max-width:520px){
  .guitar{height:340px}
}
</style>
</head>

<body>

<div class="app">

<div class="topbar">

  <a class="back" href="index.html">‹</a>

  <div class="logo">
    NOVA <span>MUSICAL</span>
  </div>

  <div class="auto-control">
    <span>Automatic</span>
    <div
      class="auto-box on"
      id="autoBox"
      role="checkbox"
      aria-checked="true"
      tabindex="0">
    </div>
  </div>

</div>

<h1 id="title">Tune your guitar</h1>

<div class="subtitle">
  Standard • E A D G B E
</div>

<div class="tuner">

<div class="meter">

  <div class="track"></div>

  <div class="tick big" style="left:8%"></div>
  <div class="tick" style="left:16%"></div>
  <div class="tick" style="left:24%"></div>
  <div class="tick" style="left:32%"></div>
  <div class="tick" style="left:40%"></div>

  <div class="tick big" style="left:50%"></div>

  <div class="tick" style="left:60%"></div>
  <div class="tick" style="left:68%"></div>
  <div class="tick" style="left:76%"></div>
  <div class="tick" style="left:84%"></div>
  <div class="tick big" style="left:92%"></div>

  <div class="target">
    <div class="fill" id="fill"></div>
  </div>

  <div class="center"></div>
  <div class="needle" id="needle"></div>

  <div class="number" id="number">0</div>

  <div class="instruction" id="instruction">
    Start tuning and play any string
  </div>

</div>

<div class="guitar">

  <div class="wood"></div>
  <div class="neck"></div>
  <div class="nut"></div>

  <div class="fret fret1"></div>
  <div class="fret fret2"></div>

  <!--
    Six strings are now spread across
    the full usable height of the neck.
  -->

  <svg
    class="string-svg"
    viewBox="0 0 650 370"
    preserveAspectRatio="none">

    <path id="string1"
      class="guitar-string s1"
      d="M419 105 L490 137 L650 137"/>

    <path id="string2"
      class="guitar-string s2"
      d="M315 105 L490 155 L650 155"/>

    <path id="string3"
      class="guitar-string s3"
      d="M211 105 L490 173 L650 173"/>

    <path id="string4"
      class="guitar-string s4"
      d="M211 257 L490 191 L650 191"/>

    <path id="string5"
      class="guitar-string s5"
      d="M315 257 L490 209 L650 209"/>

    <path id="string6"
      class="guitar-string s6"
      d="M419 257 L490 227 L650 227"/>

  </svg>

  <div class="peg p1" id="peg1"></div>
  <div class="peg p2" id="peg2"></div>
  <div class="peg p3" id="peg3"></div>

  <div class="peg p4" id="peg4"></div>
  <div class="peg p5" id="peg5"></div>
  <div class="peg p6" id="peg6"></div>

  <button class="string-choice c3" data-string="3">G</button>
  <button class="string-choice c2" data-string="2">B</button>
  <button class="string-choice c1" data-string="1">E</button>

  <button class="string-choice c4" data-string="4">D</button>
  <button class="string-choice c5" data-string="5">A</button>
  <button class="string-choice c6" data-string="6">E</button>

</div>

<div class="controls">

  <button class="start" id="start">
    Start tuning
  </button>

  <div class="status" id="status">
    Automatic detection is on.
  </div>

  <div class="complete" id="complete">
    ✓ All six strings are tuned
  </div>

</div>

</div>
</div>

<script>

/* ========================================
   NOVA GUITAR TUNER
======================================== */

const GUITAR=[
  {number:6,label:"E",name:"Low E",hz:82.4069},
  {number:5,label:"A",name:"A",hz:110.0000},
  {number:4,label:"D",name:"D",hz:146.8324},
  {number:3,label:"G",name:"G",hz:195.9977},
  {number:2,label:"B",name:"B",hz:246.9417},
  {number:1,label:"E",name:"High E",hz:329.6276}
];

const startButton=document.getElementById("start");
const autoBox=document.getElementById("autoBox");
const needle=document.getElementById("needle");
const numberDisplay=document.getElementById("number");
const instruction=document.getElementById("instruction");
const fill=document.getElementById("fill");
const status=document.getElementById("status");
const title=document.getElementById("title");
const complete=document.getElementById("complete");

const choiceButtons=[
  ...document.querySelectorAll(".string-choice")
];

let automatic=true;
let selectedString=null;

let audioContext=null;
let analyser=null;
let stream=null;
let buffer=null;
let running=false;

let pitchHistory=[];
let autoHistory=[];
let differenceHistory=[];

let lastTargetNumber=null;

let stableStart=null;
let stableString=null;

const tuned=new Set();

/* ========================================
   AUTO BUTTON
======================================== */

function toggleAutomatic(){

  automatic=!automatic;

  autoBox.classList.toggle("on",automatic);

  autoBox.setAttribute(
    "aria-checked",
    automatic ? "true":"false"
  );

  selectedString=null;

  pitchHistory=[];
  autoHistory=[];
  differenceHistory=[];

  resetConfirmation();
  clearActive();

  title.textContent="Tune your guitar";

  if(automatic){

    instruction.textContent=
      running
      ?"Play any open string"
      :"Start tuning and play any string";

    status.textContent=
      "Automatic detection is on.";

  }else{

    instruction.textContent=
      "Choose a string to tune";

    status.textContent=
      "Choose E, A, D, G, B or E.";
  }
}

autoBox.addEventListener("click",toggleAutomatic);

autoBox.addEventListener("keydown",event=>{

  if(event.key==="Enter" || event.key===" "){
    event.preventDefault();
    toggleAutomatic();
  }
});

/* ========================================
   MANUAL STRING SELECTION
======================================== */

choiceButtons.forEach(button=>{

  button.addEventListener("click",()=>{

    const number=
      Number(button.dataset.string);

    const target=
      GUITAR.find(
        s=>s.number===number
      );

    automatic=false;

    autoBox.classList.remove("on");

    autoBox.setAttribute(
      "aria-checked",
      "false"
    );

    selectedString=target;

    pitchHistory=[];
    autoHistory=[];
    differenceHistory=[];

    lastTargetNumber=target.number;

    resetConfirmation();
    clearActive();

    if(!tuned.has(target.number)){
      button.classList.add("active");
    }

    title.textContent=
      "Tune "+target.name;

    instruction.textContent=
      "Play "+target.name;

    status.textContent=
      "Listening for "+target.name+".";
  });
});

/* ========================================
   MICROPHONE
======================================== */

startButton.addEventListener("click",async()=>{

  if(running){
    stopTuner();
    return;
  }

  try{

    stream=
      await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:false,
          noiseSuppression:false,
          autoGainControl:false
        }
      });

    audioContext=
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    await audioContext.resume();

    const source=
      audioContext.createMediaStreamSource(stream);

    analyser=
      audioContext.createAnalyser();

    /*
      8192 gives enough low-E cycles
      while remaining responsive on
      a phone.
    */

    analyser.fftSize=8192;
    analyser.smoothingTimeConstant=0;

    buffer=
      new Float32Array(
        analyser.fftSize
      );

    source.connect(analyser);

    running=true;

    startButton.textContent=
      "Stop tuning";

    instruction.textContent=
      automatic
      ?"Play any open string"
      :selectedString
        ?"Play "+selectedString.name
        :"Choose a string to tune";

    status.textContent="Listening…";

    listen();

  }catch(error){

    status.textContent=
      "Please allow microphone access.";
  }
});

function stopTuner(){

  running=false;

  if(stream){
    stream.getTracks().forEach(
      track=>track.stop()
    );
  }

  if(audioContext){
    audioContext.close();
  }

  stream=null;
  audioContext=null;

  startButton.textContent=
    "Start tuning";

  status.textContent=
    "Microphone is off.";
}

/* ========================================
   MAIN LOOP
======================================== */

let lastAnalysis=0;

function listen(timestamp=0){

  if(!running)return;

  /*
    Analyse about 15 times per second.
    This gives the detector time to
    stabilise and reduces transient
    false-green flashes.
  */

  if(timestamp-lastAnalysis>65){

    lastAnalysis=timestamp;

    analyser.getFloatTimeDomainData(buffer);

    const volume=getRMS(buffer);

    if(volume>.004){

      const rawPitch=
        detectPitchYIN(
          buffer,
          audioContext.sampleRate
        );

      if(rawPitch){

        const pitch=
          stablePitch(rawPitch);

        if(pitch){

          if(automatic){
            processAutomatic(pitch);
          }else if(selectedString){
            processManual(pitch);
          }
        }
      }

    }else{

      resetConfirmation();
    }
  }

  requestAnimationFrame(listen);
}

/* ========================================
   RMS
======================================== */

function getRMS(data){

  let total=0;

  for(let i=0;i<data.length;i++){
    total+=data[i]*data[i];
  }

  return Math.sqrt(total/data.length);
}

/* ========================================
   YIN PITCH DETECTOR

   Unlike the previous detector,
   this finds the fundamental pitch
   independently of the selected string.
======================================== */

function detectPitchYIN(data,sampleRate){

  /*
    Covers below low E and comfortably
    above high E.

    High E is ~329.6 Hz.
  */

  const minFrequency=65;
  const maxFrequency=420;

  const minTau=
    Math.floor(
      sampleRate/maxFrequency
    );

  const maxTau=
    Math.ceil(
      sampleRate/minFrequency
    );

  /*
    Remove DC offset.
  */

  let mean=0;

  for(let i=0;i<data.length;i++){
    mean+=data[i];
  }

  mean/=data.length;

  /*
    Use the central part of the buffer.
  */

  const usable=
    Math.min(
      4096,
      data.length-maxTau-1
    );

  if(usable<2000){
    return null;
  }

  const difference=
    new Float64Array(maxTau+1);

  /*
    YIN difference function.
  */

  for(
    let tau=1;
    tau<=maxTau;
    tau++
  ){

    let sum=0;

    for(
      let i=0;
      i<usable;
      i++
    ){

      const delta=
        (data[i]-mean)-
        (data[i+tau]-mean);

      sum+=delta*delta;
    }

    difference[tau]=sum;
  }

  /*
    Cumulative mean normalized
    difference.
  */

  const cmnd=
    new Float64Array(maxTau+1);

  cmnd[0]=1;

  let runningSum=0;

  for(
    let tau=1;
    tau<=maxTau;
    tau++
  ){

    runningSum+=difference[tau];

    cmnd[tau]=
      runningSum===0
      ?1
      :difference[tau]*
       tau/
       runningSum;
  }

  /*
    YIN searches from SHORTER periods
    toward longer periods and accepts
    the first strong valley.

    This is important for your test:
    High E must remain High E instead
    of being folded down to Low E.
  */

  const threshold=.14;

  let tau=-1;

  for(
    let t=minTau;
    t<=maxTau;
    t++
  ){

    if(cmnd[t]<threshold){

      while(
        t+1<=maxTau &&
        cmnd[t+1]<cmnd[t]
      ){
        t++;
      }

      tau=t;
      break;
    }
  }

  /*
    Fallback: deepest valley.
  */

  if(tau<0){

    let best=1;

    for(
      let t=minTau;
      t<=maxTau;
      t++
    ){

      if(cmnd[t]<best){
        best=cmnd[t];
        tau=t;
      }
    }

    if(best>.28){
      return null;
    }
  }

  /*
    Parabolic interpolation.
  */

  let refinedTau=tau;

  if(
    tau>1 &&
    tau<maxTau
  ){

    const left=cmnd[tau-1];
    const center=cmnd[tau];
    const right=cmnd[tau+1];

    const denominator=
      left-
      2*center+
      right;

    if(
      Math.abs(denominator)>
      0.0000001
    ){

      const adjustment=
        .5*
        (left-right)/
        denominator;

      if(
        Number.isFinite(adjustment) &&
        Math.abs(adjustment)<=1
      ){
        refinedTau+=adjustment;
      }
    }
  }

  const frequency=
    sampleRate/refinedTau;

  if(
    !Number.isFinite(frequency) ||
    frequency<minFrequency ||
    frequency>maxFrequency
  ){
    return null;
  }

  return frequency;
}

/* ========================================
   PITCH STABILITY
======================================== */

function stablePitch(pitch){

  pitchHistory.push(pitch);

  if(pitchHistory.length>5){
    pitchHistory.shift();
  }

  if(pitchHistory.length<3){
    return pitch;
  }

  const sorted=
    [...pitchHistory]
    .sort((a,b)=>a-b);

  return sorted[
    Math.floor(sorted.length/2)
  ];
}

/* ========================================
   DIFFERENCE
======================================== */

function pitchDifference(frequency,target){

  return(
    1200*
    Math.log2(
      frequency/target
    )
  );
}

/* ========================================
   AUTOMATIC MODE
======================================== */

function processAutomatic(pitch){

  const target=
    nearestOpenString(pitch);

  if(!target){

    resetConfirmation();

    instruction.textContent=
      "Play an open string";

    instruction.style.color=
      "var(--muted)";

    return;
  }

  autoHistory.push(target.number);

  if(autoHistory.length>5){
    autoHistory.shift();
  }

  /*
    Require 4 of the latest 5 readings
    to agree on the same string.
  */

  const matches=
    autoHistory.filter(
      n=>n===target.number
    ).length;

  if(matches<4){
    return;
  }

  const difference=
    pitchDifference(
      pitch,
      target.hz
    );

  /*
    Don't classify pitches far between
    open strings as one of the strings.
  */

  if(Math.abs(difference)>55){

    resetConfirmation();
    return;
  }

  showReading(
    target,
    difference,
    false
  );
}

function nearestOpenString(pitch){

  let winner=null;
  let smallest=Infinity;

  for(const string of GUITAR){

    const difference=
      Math.abs(
        pitchDifference(
          pitch,
          string.hz
        )
      );

    if(difference<smallest){

      smallest=difference;
      winner=string;
    }
  }

  if(smallest>55){
    return null;
  }

  return winner;
}

/* ========================================
   MANUAL MODE

   This is deliberately different.

   We identify the ACTUAL detected pitch
   first.

   Then compare that real pitch with the
   selected string.

   No octave correction.
   No folding.
   No forcing it near the target.
======================================== */

function processManual(pitch){

  const target=selectedString;

  if(!target)return;

  const difference=
    pitchDifference(
      pitch,
      target.hz
    );

  /*
    Determine whether the sound itself
    is actually in the neighbourhood
    of the selected string.

    The selected string gets a generous
    ±100 range for tuning.

    Anything outside that is treated as
    the WRONG pitch and can NEVER fill
    the green box.
  */

  const correctPitchRegion=
    Math.abs(difference)<=100;

  showReading(
    target,
    difference,
    !correctPitchRegion
  );
}

/* ========================================
   DISPLAY
======================================== */

function showReading(
  target,
  rawDifference,
  wrongPitch
){

  /*
    Never smooth a wrong note into a
    correct one.

    This was one source of the brief
    green flashes in the old version.
  */

  let difference=rawDifference;

  if(!wrongPitch){

    if(lastTargetNumber!==target.number){
      differenceHistory=[];
    }

    differenceHistory.push(rawDifference);

    if(differenceHistory.length>5){
      differenceHistory.shift();
    }

    const sorted=
      [...differenceHistory]
      .sort((a,b)=>a-b);

    difference=
      sorted[
        Math.floor(sorted.length/2)
      ];

  }else{

    differenceHistory=[];
  }

  lastTargetNumber=target.number;

  const rounded=
    Math.round(difference);

  /*
    NUMBER IS NEVER CLAMPED.

    Examples:
    Low E → A ≈ +500
    Low E → D ≈ +1000
    Low E → High E ≈ +2400
  */

  numberDisplay.textContent=
    rounded>0
    ?"+"+rounded
    :String(rounded);

  /*
    Needle is visually limited to the
    ends of the meter.
  */

  const visual=
    Math.max(
      -50,
      Math.min(
        50,
        difference
      )
    );

  needle.style.left=
    (
      50+
      (visual/50)*42
    )+"%";

  clearActive();

  const button=
    buttonFor(target.number);

  if(!tuned.has(target.number)){
    button.classList.add("active");
  }

  title.textContent=
    "Tune "+target.name;

  /*
    WRONG NOTE / WRONG STRING
  */

  if(wrongPitch){

    resetConfirmation();

    needle.style.background=
      "var(--red)";

    numberDisplay.style.color=
      "var(--red)";

    instruction.style.color=
      "var(--red)";

    instruction.textContent=
      difference<0
      ?"Much too low"
      :"Much too high";

    setTargetState(
      target.number,
      "bad"
    );

    return;
  }

  clearBadState(target.number);

  const amount=
    Math.abs(difference);

  /*
    STRICTER COLOURS

    0–2  green
    3–4  yellow
    5+   red
  */

  if(amount<=2){

    needle.style.background=
      "var(--green)";

    numberDisplay.style.color=
      "var(--green)";

    instruction.style.color=
      "var(--green)";

    instruction.textContent=
      "Hold steady";

    confirmTuning(
      target,
      difference
    );

  }else if(amount<=4){

    resetConfirmation();

    needle.style.background=
      "var(--yellow)";

    numberDisplay.style.color=
      "var(--yellow)";

    instruction.style.color=
      "var(--yellow)";

    instruction.textContent=
      difference<0
      ?"Tune up"
      :"Tune down";

  }else{

    resetConfirmation();

    needle.style.background=
      "var(--red)";

    numberDisplay.style.color=
      "var(--red)";

    instruction.style.color=
      "var(--red)";

    instruction.textContent=
      difference<0
      ?"Tune up"
      :"Tune down";
  }
}

/* ========================================
   HOLD TO CONFIRM
======================================== */

function confirmTuning(target,difference){

  if(Math.abs(difference)>2){

    resetConfirmation();
    return;
  }

  if(tuned.has(target.number)){

    fill.style.height="100%";

    instruction.textContent=
      "In tune ✓";

    return;
  }

  if(stableString!==target.number){

    stableString=target.number;
    stableStart=performance.now();

    fill.style.height="0%";
  }

  const elapsed=
    performance.now()-
    stableStart;

  /*
    Must remain within ±2 for
    2.5 seconds.
  */

  const progress=
    Math.min(
      1,
      elapsed/2500
    );

  fill.style.height=
    (progress*100)+"%";

  if(progress>=1){

    markTuned(target);

    stableStart=null;
    stableString=null;
  }
}

function resetConfirmation(){

  stableStart=null;
  stableString=null;

  fill.style.height="0%";
}

/* ========================================
   TUNED
======================================== */

function markTuned(target){

  tuned.add(target.number);

  const button=
    buttonFor(target.number);

  const peg=
    document.getElementById(
      "peg"+target.number
    );

  const string=
    document.getElementById(
      "string"+target.number
    );

  button.classList.remove(
    "active",
    "bad"
  );

  peg.classList.remove("bad");
  string.classList.remove("bad");

  button.classList.add("good");
  peg.classList.add("good");
  string.classList.add("good");

  fill.style.height="100%";

  numberDisplay.textContent="0";

  numberDisplay.style.color=
    "var(--green)";

  instruction.textContent=
    "In tune ✓";

  instruction.style.color=
    "var(--green)";

  status.textContent=
    target.name+" is tuned.";

  if(tuned.size===6){

    complete.style.display="block";

    title.textContent=
      "Guitar tuned ✓";
  }
}

/* ========================================
   WRONG STRING STATE
======================================== */

function setTargetState(number,state){

  if(tuned.has(number)){
    return;
  }

  const button=buttonFor(number);

  const peg=
    document.getElementById(
      "peg"+number
    );

  const string=
    document.getElementById(
      "string"+number
    );

  button.classList.remove("active");

  button.classList.add(state);
  peg.classList.add(state);
  string.classList.add(state);
}

function clearBadState(number){

  if(tuned.has(number)){
    return;
  }

  const button=buttonFor(number);

  const peg=
    document.getElementById(
      "peg"+number
    );

  const string=
    document.getElementById(
      "string"+number
    );

  button.classList.remove("bad");
  peg.classList.remove("bad");
  string.classList.remove("bad");
}

/* ========================================
   HELPERS
======================================== */

function buttonFor(number){

  return document.querySelector(
    '.string-choice[data-string="'+
    number+
    '"]'
  );
}

function clearActive(){

  choiceButtons.forEach(button=>{

    const number=
      Number(button.dataset.string);

    if(!tuned.has(number)){
      button.classList.remove("active");
    }
  });
}

/*
  Intentionally no localStorage.

  Leaving or refreshing resets
  the tuning session.
*/

</script>
