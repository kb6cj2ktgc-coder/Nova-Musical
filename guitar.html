<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101416">

<title>Nova Musical — Guitar Tuner</title>

<style>
:root{
  --bg:#101416;
  --panel:#171c1f;
  --white:#f7f7f7;
  --muted:#8c9297;
  --green:#16d59a;
  --yellow:#e6d94d;
  --red:#ff4c5d;
  --grey:#777d81;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--white);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button{
  font-family:inherit;
}

.app{
  width:min(100%,760px);
  margin:auto;
  padding:
    max(18px,env(safe-area-inset-top))
    14px
    max(45px,env(safe-area-inset-bottom));
}

/* =========================
   HEADER
========================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px;
}

.back{
  color:#d0d4d6;
  text-decoration:none;
  font-size:29px;
  font-weight:800;
  line-height:1;
}

.logo{
  flex:1;
  font-size:22px;
  font-weight:950;
  letter-spacing:-.4px;
}

.logo span{
  color:var(--green);
}

.auto-control{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:850;
}

.auto-box{
  width:30px;
  height:30px;
  border:2px solid #858b8f;
  border-radius:8px;
  background:#252a2d;
  display:grid;
  place-items:center;
  cursor:pointer;
}

.auto-box.on{
  background:var(--green);
  border-color:var(--green);
  color:#06150f;
}

.auto-box.on::after{
  content:"✓";
  font-size:19px;
  font-weight:1000;
}

/* =========================
   TITLE
========================= */

h1{
  margin:0;
  text-align:center;
  font-size:30px;
  letter-spacing:-.7px;
}

.subtitle{
  margin:7px 0 20px;
  text-align:center;
  color:var(--muted);
}

/* =========================
   TUNER CARD
========================= */

.tuner{
  overflow:hidden;
  border:1px solid #ffffff12;
  border-radius:25px;
  background:var(--panel);
  box-shadow:0 20px 60px #0004;
}

/* =========================
   METER
========================= */

.meter{
  position:relative;
  height:225px;
  border-bottom:1px solid #ffffff10;

  background:
    linear-gradient(
      #ffffff07 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      #ffffff07 1px,
      transparent 1px
    );

  background-size:32px 32px;
}

.track{
  position:absolute;
  left:8%;
  right:8%;
  top:75px;
  height:2px;
  background:#ffffff22;
}

.tick{
  position:absolute;
  top:59px;
  width:2px;
  height:34px;
  background:#e8e9e9;
  opacity:.75;
}

.tick.big{
  top:48px;
  height:56px;
  opacity:1;
}

.target{
  position:absolute;
  left:50%;
  top:42px;
  transform:translateX(-50%);
  width:62px;
  height:68px;
  overflow:hidden;
  border:2px solid #a9adaf;
  border-radius:7px;
  background:#707579;
}

.fill{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:0%;
  background:var(--green);
  transition:height .12s linear;
}

.center{
  position:absolute;
  left:50%;
  top:38px;
  width:3px;
  height:78px;
  transform:translateX(-50%);
  background:white;
  z-index:4;
}

.needle{
  position:absolute;
  left:50%;
  top:36px;
  width:5px;
  height:82px;
  transform:translateX(-50%);
  border-radius:4px;
  background:var(--grey);
  z-index:5;

  /*
    Smooth visually.

    This does NOT slow down or average
    the actual pitch measurement.
  */
  transition:
    left .11s linear,
    background .12s ease;
}

.number{
  position:absolute;
  top:126px;
  left:50%;
  transform:translateX(-50%);
  min-width:120px;
  text-align:center;
  font-size:36px;
  font-weight:950;
  font-variant-numeric:tabular-nums;
}

.instruction{
  position:absolute;
  top:177px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:17px;
  font-weight:850;
}

/* =========================
   GUITAR
========================= */

.guitar{
  position:relative;
  width:min(100%,650px);
  height:375px;
  margin:10px auto 0;
}

.wood{
  position:absolute;
  left:6%;
  top:66px;
  width:72%;
  height:230px;

  clip-path:polygon(
    0 22%,
    8% 5%,
    64% 8%,
    80% 17%,
    100% 28%,
    100% 72%,
    80% 83%,
    64% 92%,
    8% 95%,
    0 78%
  );

  background:
    repeating-linear-gradient(
      1deg,
      rgba(255,255,255,.025) 0,
      rgba(255,255,255,.025) 2px,
      rgba(0,0,0,.035) 3px,
      rgba(0,0,0,.035) 5px
    ),
    linear-gradient(
      90deg,
      #623014,
      #a45b27 43%,
      #783b1a 78%,
      #4a2515
    );

  box-shadow:
    inset 0 0 38px #0008,
    0 15px 40px #0007;
}

.wood::after{
  content:"N";
  position:absolute;
  left:16%;
  top:50%;
  transform:translateY(-50%);
  color:#27130655;
  font-size:58px;
  font-weight:1000;
}

/*
  Fretboard.
*/

.neck{
  position:absolute;
  left:75%;
  right:0;
  top:126px;
  height:110px;
  background:
    linear-gradient(
      #38241a,
      #60402c 50%,
      #352219
    );
  box-shadow:inset 0 0 15px #0008;
  z-index:2;
}

.nut{
  position:absolute;
  left:75%;
  top:126px;
  width:8px;
  height:110px;
  background:#eee8dc;
  z-index:7;
}

.fret{
  position:absolute;
  top:126px;
  width:2px;
  height:110px;
  background:#b69b67;
  z-index:3;
}

.fret1{
  right:12%;
}

.fret2{
  right:4%;
}

/* =========================
   STRINGS

   Moved a little farther down,
   as requested.

   They remain inside the neck.
========================= */

.string-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:8;
  pointer-events:none;
}

.guitar-string{
  fill:none;
  stroke:#c9cccd;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:
    stroke .14s,
    filter .14s;
}

.s2{stroke-width:1.9}
.s3{stroke-width:2.2}
.s4{stroke-width:2.5}
.s5{stroke-width:2.8}
.s6{stroke-width:3.2}

.guitar-string.bad{
  stroke:var(--red);
  filter:
    drop-shadow(
      0 0 5px var(--red)
    );
}

.guitar-string.good{
  stroke:var(--green);
  filter:
    drop-shadow(
      0 0 6px var(--green)
    );
}

/* =========================
   PEGS
========================= */

.peg{
  position:absolute;
  width:44px;
  height:44px;
  border-radius:50%;
  z-index:10;
  border:2px solid #aeb2b4;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff 0,
      #daddde 18%,
      #8b9092 44%,
      #45494b 70%,
      #c5c8c9 73%,
      #55595b 100%
    );
}

.peg::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:13px;
  height:13px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#d8dbdc;
  border:2px solid #5c6062;
}

.p3{
  left:29%;
  top:83px;
}

.p2{
  left:45%;
  top:83px;
}

.p1{
  left:61%;
  top:83px;
}

.p4{
  left:29%;
  top:235px;
}

.p5{
  left:45%;
  top:235px;
}

.p6{
  left:61%;
  top:235px;
}

/* =========================
   STRING BUTTONS
========================= */

.string-choice{
  position:absolute;
  width:55px;
  height:48px;
  border:2px solid #e3e5e6;
  border-radius:17px;
  background:#171c1f;
  color:white;
  font-size:20px;
  font-weight:900;
  z-index:12;
  cursor:pointer;
}

.c3{
  left:28.2%;
  top:27px;
}

.c2{
  left:44.2%;
  top:27px;
}

.c1{
  left:60.2%;
  top:27px;
}

.c4{
  left:28.2%;
  top:293px;
}

.c5{
  left:44.2%;
  top:293px;
}

.c6{
  left:60.2%;
  top:293px;
}

.string-choice.active{
  background:white;
  color:#14181a;
}

.string-choice.bad{
  background:var(--red);
  border-color:var(--red);
}

.string-choice.good{
  background:var(--green);
  border-color:var(--green);
  color:#061a12;
  box-shadow:0 0 18px #16d59a99;
}

/* =========================
   CONTROLS
========================= */

.controls{
  padding:8px 18px 24px;
}

.start{
  width:100%;
  padding:16px;
  border:0;
  border-radius:16px;
  background:var(--green);
  color:#06150f;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

.start:disabled{
  opacity:.55;
}

.status{
  margin-top:13px;
  min-height:20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.complete{
  display:none;
  margin-top:14px;
  padding:14px;
  border:1px solid #16d59a66;
  border-radius:14px;
  background:#16d59a12;
  color:var(--green);
  text-align:center;
  font-weight:900;
}

@media(max-width:520px){

  .guitar{
    height:350px;
  }

  h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<div class="app">

      <span>Automatic</span>

        preserveAspectRatio="none">

          id="string1"

          d="
            M419 105

<script>

/*
=========================================================
NOVA MUSICAL
GUITAR TUNER INTERFACE

Pitch detection is performed by:

nova-tuner-worklet.js

This page handles:
- automatic string selection
- manual string selection
- meter
- tuning directions
- stability confirmation
- tuned-string memory for this session only
=========================================================
*/


/* =====================================================
   STANDARD GUITAR FREQUENCIES
===================================================== */

const GUITAR = [

  {
    number:6,
    label:"E",
    name:"Low E",
    hz:82.4069
  },

  {
    number:5,
    label:"A",
    name:"A",
    hz:110.0000
  },

  {
    number:4,
    label:"D",
    name:"D",
    hz:146.8324
  },

  {
    number:3,
    label:"G",
    name:"G",
    hz:195.9977
  },

  {
    number:2,
    label:"B",
    name:"B",
    hz:246.9417
  },

  {
    number:1,
    label:"E",
    name:"High E",
    hz:329.6276
  }

];


/* =====================================================
   ELEMENTS
===================================================== */

const startButton =
  document.getElementById("start");

const autoBox =
  document.getElementById("autoBox");

const needle =
  document.getElementById("needle");

const numberDisplay =
  document.getElementById("number");

const instruction =
  document.getElementById("instruction");

const fill =
  document.getElementById("fill");

const status =
  document.getElementById("status");

const title =
  document.getElementById("title");

const complete =
  document.getElementById("complete");

const choiceButtons = [
  ...document.querySelectorAll(
    ".string-choice"
  )
];


/* =====================================================
   AUDIO STATE
===================================================== */

let audioContext = null;

let stream = null;

let source = null;

let workletNode = null;

let silentGain = null;

let running = false;


/* =====================================================
   TUNER STATE
===================================================== */

let automatic = true;

let selectedString = null;


/*
Automatic mode deliberately uses
VERY SHORT confirmation.

We do not want Low E hanging around
while the player is already playing G.
*/

let autoCandidate = null;

let autoCandidateHits = 0;


/*
Meter smoothing.

This is display-only.
*/

let visualValue = 0;

let visualAnimation = null;


/*
Short tuning history.

Cleared immediately on a new pluck
or a new detected string.
*/

let centsHistory = [];


/*
Green hold state.
*/

let holdStart = null;

let holdString = null;


/*
Strings tuned during THIS page session.

Nothing is stored in localStorage.
*/

const tuned =
  new Set();


/*
Last good pitch time.
*/

let lastPitchTime = 0;


/* =====================================================
   AUTOMATIC / MANUAL MODE
===================================================== */

autoBox.addEventListener(
  "click",
  () => {

    automatic =
      !automatic;


    autoBox.classList.toggle(
      "on",
      automatic
    );


    autoBox.setAttribute(
      "aria-checked",
      automatic
        ? "true"
        : "false"
    );


    selectedString = null;

    resetPitchState();

    resetHold();

    clearActive();


    title.textContent =
      "Tune your guitar";


    if (automatic) {

      instruction.textContent =
        running
          ? "Play any open string"
          : "Start tuning and play any string";


      status.textContent =
        "Automatic detection is on.";

    } else {

      instruction.textContent =
        "Choose a string to tune";


      status.textContent =
        "Choose E, A, D, G, B or E.";
    }
  }
);


/* =====================================================
   MANUAL STRING BUTTONS
===================================================== */

choiceButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        const number =
          Number(
            button.dataset.string
          );


        selectedString =
          GUITAR.find(
            string =>
              string.number === number
          );


        automatic = false;


        autoBox.classList.remove(
          "on"
        );


        autoBox.setAttribute(
          "aria-checked",
          "false"
        );


        resetPitchState();

        resetHold();

        clearActive();


        if (
          !tuned.has(number)
        ) {

          button.classList.add(
            "active"
          );
        }


        title.textContent =
          "Tune " +
          selectedString.name;


        instruction.textContent =
          "Play " +
          selectedString.name;


        status.textContent =
          "Listening for " +
          selectedString.name +
          ".";
      }
    );
  }
);


/* =====================================================
   START / STOP
===================================================== */

startButton.addEventListener(
  "click",
  async () => {

    if (running) {

      stopTuner();

      return;
    }


    await startTuner();
  }
);


/* =====================================================
   START AUDIOWORKLET
===================================================== */

async function startTuner() {

  startButton.disabled = true;

  status.textContent =
    "Starting Nova tuner…";


  try {

    /*
    Request raw microphone audio.

    Browser/device may choose to ignore some constraints,
    but these settings ask it not to modify guitar audio.
    */

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: {

            echoCancellation:false,

            noiseSuppression:false,

            autoGainControl:false,

            channelCount:1

          }

        });


    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    await audioContext.resume();


    /*
    THIS is the connection to the file
    you just created.
    */

    await audioContext.audioWorklet
      .addModule(
        "./nova-tuner-worklet.js"
      );


    source =
      audioContext
        .createMediaStreamSource(
          stream
        );


    workletNode =
      new AudioWorkletNode(

        audioContext,

        "nova-tuner-processor",

        {
          numberOfInputs:1,
          numberOfOutputs:1,
          outputChannelCount:[1]
        }

      );


    /*
    Worklet output is muted.

    The connection to destination keeps
    the processing graph alive without
    playing the microphone through the
    phone speaker.
    */

    silentGain =
      audioContext.createGain();


    silentGain.gain.value = 0;


    source.connect(
      workletNode
    );


    workletNode.connect(
      silentGain
    );


    silentGain.connect(
      audioContext.destination
    );


    workletNode.port.onmessage =
      handleWorkletMessage;


    running = true;


    startButton.disabled = false;

    startButton.textContent =
      "Stop tuning";


    resetPitchState();

    resetHold();


    if (automatic) {

      instruction.textContent =
        "Play any open string";

      status.textContent =
        "Automatic detection is on.";

    } else if (selectedString) {

      instruction.textContent =
        "Play " +
        selectedString.name;

      status.textContent =
        "Listening for " +
        selectedString.name +
        ".";

    } else {

      instruction.textContent =
        "Choose a string to tune";

      status.textContent =
        "Choose E, A, D, G, B or E.";
    }

  } catch (error) {

    console.error(error);


    startButton.disabled = false;

    startButton.textContent =
      "Start tuning";


    status.textContent =
      "Nova couldn't start the microphone. Check microphone permission.";


    instruction.textContent =
      "Microphone unavailable";


    cleanAudio();
  }
}


/* =====================================================
   STOP
===================================================== */

function stopTuner() {

  running = false;

  cleanAudio();

  resetPitchState();

  resetHold();

  startButton.disabled = false;

  startButton.textContent =
    "Start tuning";

  status.textContent =
    "Microphone is off.";

  instruction.textContent =
    automatic
      ? "Start tuning and play any string"
      : selectedString
        ? "Play " + selectedString.name
        : "Choose a string to tune";
}


/* =====================================================
   CLEAN AUDIO
===================================================== */

function cleanAudio() {

  if (stream) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );
  }


  try {

    if (source) {
      source.disconnect();
    }

  } catch (error) {}


  try {

    if (workletNode) {
      workletNode.disconnect();
    }

  } catch (error) {}


  try {

    if (silentGain) {
      silentGain.disconnect();
    }

  } catch (error) {}


  if (audioContext) {

    try {
      audioContext.close();
    } catch (error) {}
  }


  stream = null;

  source = null;

  workletNode = null;

  silentGain = null;

  audioContext = null;
}


/* =====================================================
   RECEIVE WORKLET DATA
===================================================== */

function handleWorkletMessage(event) {

  if (!running) {
    return;
  }


  const data =
    event.data;


  if (!data) {
    return;
  }


  /*
  -------------------------------------------------------
  NEW PLUCK

  This is important.

  The previous Low-E averaging is thrown away
  immediately when the worklet detects a fresh attack.
  -------------------------------------------------------
  */

  if (data.type === "onset") {

    centsHistory = [];

    autoCandidate = null;

    autoCandidateHits = 0;

    resetHold();

    return;
  }


  /*
  -------------------------------------------------------
  SILENCE

  Don't leave old pitch history hanging around forever.
  -------------------------------------------------------
  */

  if (data.type === "silence") {

    if (
      performance.now() -
      lastPitchTime >
      300
    ) {

      centsHistory = [];

      autoCandidate = null;

      autoCandidateHits = 0;

      resetHold();
    }

    return;
  }


  /*
  -------------------------------------------------------
  PITCH
  -------------------------------------------------------
  */

  if (
    data.type === "pitch" &&
    Number.isFinite(
      data.frequency
    )
  ) {

    lastPitchTime =
      performance.now();


    if (automatic) {

      processAutomaticPitch(
        data.frequency,
        data.confidence
      );

    } else if (selectedString) {

      processManualPitch(
        data.frequency,
        data.confidence
      );
    }
  }
}


/* =====================================================
   AUTOMATIC STRING DETECTION
===================================================== */

function processAutomaticPitch(
  frequency,
  confidence
) {

  /*
  Find the closest REAL open-string frequency.

  No octave folding.

  No forcing every sound into Low E.
  */

  let bestString = null;

  let bestDistance =
    Infinity;


  for (
    const string of GUITAR
  ) {

    const difference =
      centsBetween(
        frequency,
        string.hz
      );


    const distance =
      Math.abs(
        difference
      );


    if (
      distance <
      bestDistance
    ) {

      bestDistance =
        distance;

      bestString =
        string;
    }
  }


  /*
  If it isn't plausibly one of the six
  open strings, don't lie about which
  string it is.
  */

  if (
    !bestString ||
    bestDistance > 85
  ) {

    autoCandidate = null;

    autoCandidateHits = 0;

    centsHistory = [];

    resetHold();

    instruction.textContent =
      "Play a clear open string";

    instruction.style.color =
      "var(--muted)";

    return;
  }


  /*
  New string?

  Change immediately.

  Previous string history disappears.
  */

  if (
    autoCandidate !==
    bestString.number
  ) {

    autoCandidate =
      bestString.number;

    autoCandidateHits = 1;

    centsHistory = [];

    resetHold();


    showDetectedString(
      bestString
    );


    /*
    First reliable reading is already
    allowed onto the meter.

    This makes Automatic feel fast.
    */

    const difference =
      centsBetween(
        frequency,
        bestString.hz
      );


    displayReading(
      bestString,
      difference,
      false,
      confidence
    );


    return;
  }


  autoCandidateHits++;


  const difference =
    centsBetween(
      frequency,
      bestString.hz
    );


  displayReading(
    bestString,
    difference,
    false,
    confidence
  );
}


/* =====================================================
   MANUAL MODE
===================================================== */

function processManualPitch(
  frequency,
  confidence
) {

  if (!selectedString) {
    return;
  }


  /*
  Direct comparison.

  Absolutely NO octave folding.

  Example:

  Low E selected
  High E played

  remains approximately +2400 internally.
  */

  const difference =
    centsBetween(
      frequency,
      selectedString.hz
    );


  /*
  More than about one semitone away
  means this is not the selected string
  being slightly out of tune.
  */

  const wrongPitch =
    Math.abs(
      difference
    ) > 120;


  displayReading(
    selectedString,
    difference,
    wrongPitch,
    confidence
  );
}


/* =====================================================
   MUSICAL DIFFERENCE
===================================================== */

function centsBetween(
  frequency,
  target
) {

  return (
    1200 *
    Math.log2(
      frequency /
      target
    )
  );
}


/* =====================================================
   SHORT ROBUST DISPLAY FILTER

   IMPORTANT:
   This is deliberately short.

   We want stability without creating
   the "stuck at -9" problem.
===================================================== */

function filterDifference(
  value
) {

  centsHistory.push(
    value
  );


  if (
    centsHistory.length > 3
  ) {

    centsHistory.shift();
  }


  if (
    centsHistory.length === 1
  ) {

    return value;
  }


  /*
  Median is resistant to a single
  weird reading.
  */

  const values =
    [...centsHistory]
      .sort(
        (a,b) => a-b
      );


  if (
    values.length === 2
  ) {

    return (
      values[0] +
      values[1]
    ) / 2;
  }


  return values[1];
}


/* =====================================================
   DISPLAY READING
===================================================== */

function displayReading(
  target,
  rawDifference,
  wrongPitch,
  confidence
) {

  let difference;


  if (wrongPitch) {

    /*
    Do not average a wrong string
    with the selected string.
    */

    centsHistory = [];

    difference =
      rawDifference;

    resetHold();

  } else {

    difference =
      filterDifference(
        rawDifference
      );
  }


  /*
  -------------------------------------------------------
  NUMBER

  User-facing UI deliberately shows ONLY the number.

  No "cents".
  No cent symbol.
  -------------------------------------------------------
  */

  let rounded =
    Math.round(
      difference
    );


  /*
  Avoid displaying "-0".
  */

  if (
    Object.is(
      rounded,
      -0
    )
  ) {

    rounded = 0;
  }


  numberDisplay.textContent =
    rounded > 0
      ? "+" + rounded
      : String(rounded);


  /*
  -------------------------------------------------------
  METER

  Number remains unlimited.

  Only the visual needle is restricted
  to the meter's physical width.
  -------------------------------------------------------
  */

  const meterValue =
    Math.max(
      -50,
      Math.min(
        50,
        difference
      )
    );


  moveNeedle(
    meterValue
  );


  title.textContent =
    "Tune " +
    target.name;


  clearActive();


  const button =
    buttonFor(
      target.number
    );


  if (
    !tuned.has(
      target.number
    )
  ) {

    button.classList.add(
      "active"
    );
  }


  /*
  -------------------------------------------------------
  WRONG STRING
  -------------------------------------------------------
  */

  if (wrongPitch) {

    setColour("red");

    instruction.textContent =
      difference < 0
        ? "Too low for " +
          target.name
        : "Too high for " +
          target.name;


    flashWrong(
      target.number
    );


    return;
  }


  clearWrong(
    target.number
  );


  const amount =
    Math.abs(
      difference
    );


  /*
  -------------------------------------------------------
  TUNING ZONES

  ±2  = green
  ±4  = close
  >4  = needs tuning

  We do not mark +6 or -9 as tuned.
  -------------------------------------------------------
  */

  if (amount <= 2) {

    setColour(
      "green"
    );


    instruction.textContent =
      "Hold steady";


    confirmTuning(
      target,
      difference,
      confidence
    );


  } else if (amount <= 4) {

    resetHold();


    setColour(
      "yellow"
    );


    instruction.textContent =
      difference < 0
        ? "Tune up"
        : "Tune down";


  } else {

    resetHold();


    setColour(
      "red"
    );


    instruction.textContent =
      difference < 0
        ? "Tune up"
        : "Tune down";
  }
}


/* =====================================================
   SMOOTH NEEDLE

   The engine measurement itself is untouched.

   Only the drawing is interpolated.
===================================================== */

function moveNeedle(
  targetValue
) {

  if (
    visualAnimation
  ) {

    cancelAnimationFrame(
      visualAnimation
    );
  }


  function animate() {

    const difference =
      targetValue -
      visualValue;


    /*
    Fairly fast smoothing.

    It should glide rather than jerk,
    but shouldn't lag behind a peg turn.
    */

    visualValue +=
      difference * .36;


    if (
      Math.abs(
        difference
      ) < .08
    ) {

      visualValue =
        targetValue;
    }


    const position =
      50 +
      (
        visualValue /
        50
      ) * 42;


    needle.style.left =
      position + "%";


    if (
      Math.abs(
        targetValue -
        visualValue
      ) > .08
    ) {

      visualAnimation =
        requestAnimationFrame(
          animate
        );

    } else {

      visualAnimation =
        null;
    }
  }


  animate();
}


/* =====================================================
   COLOUR
===================================================== */

function setColour(
  colour
) {

  let value =
    "var(--grey)";


  if (
    colour === "green"
  ) {

    value =
      "var(--green)";
  }


  if (
    colour === "yellow"
  ) {

    value =
      "var(--yellow)";
  }


  if (
    colour === "red"
  ) {

    value =
      "var(--red)";
  }


  needle.style.background =
    value;


  numberDisplay.style.color =
    value;


  instruction.style.color =
    value;
}


/* =====================================================
   HOLD / CONFIRM

   A string must remain genuinely
   centred rather than merely crossing
   zero for one instant.
===================================================== */

function confirmTuning(
  target,
  difference,
  confidence
) {

  if (
    Math.abs(
      difference
    ) > 2
  ) {

    resetHold();

    return;
  }


  /*
  Require decent detector confidence
  before permanently turning green.
  */

  if (
    Number.isFinite(confidence) &&
    confidence < .84
  ) {

    resetHold();

    return;
  }


  if (
    tuned.has(
      target.number
    )
  ) {

    fill.style.height =
      "100%";


    instruction.textContent =
      "In tune ✓";


    return;
  }


  if (
    holdString !==
    target.number
  ) {

    holdString =
      target.number;


    holdStart =
      performance.now();


    fill.style.height =
      "0%";
  }


  const elapsed =
    performance.now() -
    holdStart;


  /*
  1.5 seconds.

  Long enough to confirm stability,
  short enough not to feel annoying.
  */

  const progress =
    Math.min(
      1,
      elapsed / 1500
    );


  fill.style.height =
    (
      progress * 100
    ) + "%";


  if (
    progress >= 1
  ) {

    markTuned(
      target
    );
  }
}


/* =====================================================
   RESET HOLD
===================================================== */

function resetHold() {

  holdStart = null;

  holdString = null;

  fill.style.height =
    "0%";
}


/* =====================================================
   MARK STRING TUNED
===================================================== */

function markTuned(
  target
) {

  tuned.add(
    target.number
  );


  const button =
    buttonFor(
      target.number
    );


  const peg =
    document.getElementById(
      "peg" +
      target.number
    );


  const string =
    document.getElementById(
      "string" +
      target.number
    );


  button.classList.remove(
    "active",
    "bad"
  );


  peg.classList.remove(
    "bad"
  );


  string.classList.remove(
    "bad"
  );


  button.classList.add(
    "good"
  );


  peg.classList.add(
    "good"
  );


  string.classList.add(
    "good"
  );


  fill.style.height =
    "100%";


  setColour(
    "green"
  );


  instruction.textContent =
    "In tune ✓";


  status.textContent =
    target.name +
    " is tuned.";


  holdStart = null;

  holdString = null;


  if (
    tuned.size === 6
  ) {

    complete.style.display =
      "block";


    title.textContent =
      "Guitar tuned ✓";
  }
}


/* =====================================================
   AUTOMATIC STRING VISUAL
===================================================== */

function showDetectedString(
  target
) {

  clearActive();


  const button =
    buttonFor(
      target.number
    );


  if (
    !tuned.has(
      target.number
    )
  ) {

    button.classList.add(
      "active"
    );
  }


  status.textContent =
    "Detected " +
    target.name +
    ".";
}


/* =====================================================
   WRONG STRING FLASH

   Red once, then clear.

   It does NOT continuously blink.
===================================================== */

const wrongTimers =
  new Map();


function flashWrong(
  number
) {

  if (
    tuned.has(number)
  ) {

    return;
  }


  const button =
    buttonFor(number);


  const peg =
    document.getElementById(
      "peg" + number
    );


  const string =
    document.getElementById(
      "string" + number
    );


  button.classList.add(
    "bad"
  );


  peg.classList.add(
    "bad"
  );


  string.classList.add(
    "bad"
  );


  if (
    wrongTimers.has(number)
  ) {

    return;
  }


  const timer =
    setTimeout(
      () => {

        clearWrong(
          number
        );


        wrongTimers.delete(
          number
        );

      },
      350
    );


  wrongTimers.set(
    number,
    timer
  );
}


/* =====================================================
   CLEAR WRONG
===================================================== */

function clearWrong(
  number
) {

  if (
    tuned.has(number)
  ) {

    return;
  }


  const button =
    buttonFor(number);


  const peg =
    document.getElementById(
      "peg" + number
    );


  const string =
    document.getElementById(
      "string" + number
    );


  button.classList.remove(
    "bad"
  );


  peg.classList.remove(
    "bad"
  );


  string.classList.remove(
    "bad"
  );
}


/* =====================================================
   BUTTON LOOKUP
===================================================== */

function buttonFor(
  number
) {

  return document.querySelector(
    '.string-choice[data-string="' +
    number +
    '"]'
  );
}


/* =====================================================
   CLEAR ACTIVE
===================================================== */

function clearActive() {

  choiceButtons.forEach(
    button => {

      const number =
        Number(
          button.dataset.string
        );


      if (
        !tuned.has(number)
      ) {

        button.classList.remove(
          "active"
        );
      }
    }
  );
}


/* =====================================================
   RESET PITCH STATE
===================================================== */

function resetPitchState() {

  autoCandidate = null;

  autoCandidateHits = 0;

  centsHistory = [];

  visualValue = 0;


  if (
    visualAnimation
  ) {

    cancelAnimationFrame(
      visualAnimation
    );


    visualAnimation = null;
  }


  needle.style.left =
    "50%";


  numberDisplay.textContent =
    "0";


  numberDisplay.style.color =
    "var(--white)";


  needle.style.background =
    "var(--grey)";
}


/* =====================================================
   PAGE EXIT

   Stop microphone cleanly.

   Tuned-state intentionally disappears
   when the page is reloaded or left.
===================================================== */

window.addEventListener(
  "pagehide",
  () => {

    if (running) {

      running = false;

      cleanAudio();
    }
  }
);

</script>

</body>
</html>
