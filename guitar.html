<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d12">

<title>Nova Guitar AI</title>

<style>
:root{
  --bg:#090d12;
  --panel:#101720;
  --panel2:#151e2b;
  --line:rgba(255,255,255,.09);
  --text:#f7f9fb;
  --muted:#8996a7;
  --green:#18e7a1;
  --greenSoft:rgba(24,231,161,.12);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{overflow:hidden}

button,textarea,input{
  font:inherit;
}

button{cursor:pointer}

.app{
  height:100dvh;
  max-width:760px;
  margin:auto;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(circle at 18% 0%,rgba(80,80,255,.22),transparent 27%),
    radial-gradient(circle at 86% 0%,rgba(0,225,165,.15),transparent 25%),
    var(--bg);
}

/* HEADER */

.header{
  flex:0 0 auto;
  padding:max(14px,env(safe-area-inset-top)) 16px 12px;
  border-bottom:1px solid var(--line);
  background:rgba(9,13,18,.88);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  z-index:20;
}

.headerRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.iconButton{
  width:46px;
  height:46px;
  border:1px solid var(--line);
  border-radius:15px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.045);
  color:white;
  font-size:23px;
}

.backButton{
  text-decoration:none;
}

.brand{
  text-align:center;
}

.brandName{
  font-size:17px;
  font-weight:900;
}

.brandName span{
  color:var(--green);
}

.online{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.onlineDot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:5px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 145px;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  display:none;
}

.intro{
  padding:8px 5px 20px;
}

.aiIdentity{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:26px;
  color:#04130e;
  background:linear-gradient(145deg,#7b72ff,var(--green));
  box-shadow:0 0 0 3px rgba(255,255,255,.06);
}

.aiTitle{
  font-size:20px;
  font-weight:900;
}

.aiSubtitle{
  margin-top:3px;
  color:var(--muted);
  font-size:13px;
}

.intro h1{
  margin:0;
  font-size:clamp(31px,8vw,46px);
  line-height:1.05;
  letter-spacing:-1.4px;
}

.intro h1 span{
  color:var(--green);
}

.introText{
  margin-top:13px;
  max-width:600px;
  color:#c7d0da;
  font-size:16px;
  line-height:1.55;
}

/* MESSAGES */

.messageRow{
  display:flex;
  margin:14px 0;
  animation:appear .2s ease;
}

@keyframes appear{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:translateY(0)}
}

.messageRow.user{
  justify-content:flex-end;
}

.messageRow.nova{
  justify-content:flex-start;
}

.message{
  max-width:88%;
  padding:13px 15px;
  border-radius:20px;
  font-size:16px;
  line-height:1.48;
  white-space:pre-wrap;
  word-break:break-word;
}

.messageRow.nova .message{
  background:var(--panel);
  border:1px solid var(--line);
  border-bottom-left-radius:6px;
}

.messageRow.user .message{
  background:var(--green);
  color:#06140f;
  font-weight:650;
  border-bottom-right-radius:6px;
}

.novaLabel{
  margin:18px 0 7px 3px;
  color:var(--muted);
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

/* SUGGESTIONS */

.suggestions{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:5px 2px 12px;
}

.suggestions::-webkit-scrollbar{
  display:none;
}

.suggestion{
  flex:0 0 auto;
  padding:11px 14px;
  border:1px solid rgba(24,231,161,.28);
  border-radius:999px;
  background:var(--greenSoft);
  color:#dffbf2;
  font-size:14px;
  font-weight:750;
  white-space:nowrap;
}

/* THINKING */

.thinking{
  display:inline-flex;
  gap:5px;
}

.thinking i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--muted);
  animation:pulse 1s infinite;
}

.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}

@keyframes pulse{
  0%,60%,100%{opacity:.3;transform:translateY(0)}
  30%{opacity:1;transform:translateY(-3px)}
}

/* COMPOSER */

.composerArea{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:10px 13px max(12px,env(safe-area-inset-bottom));
  background:
    linear-gradient(
      transparent,
      rgba(9,13,18,.97) 24%,
      var(--bg) 55%
    );
  z-index:30;
}

.composer{
  min-height:60px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:7px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:25px;
  background:#111925;
}

textarea{
  flex:1;
  min-height:44px;
  max-height:130px;
  resize:none;
  padding:11px 9px 8px;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:16px;
}

textarea::placeholder{
  color:#69778b;
}

.composerButton{
  width:46px;
  height:46px;
  flex:0 0 auto;
  border:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:20px;
}

.mic{
  color:var(--green);
  background:rgba(24,231,161,.10);
}

.send{
  background:var(--green);
  color:#06140f;
  font-size:22px;
  font-weight:950;
}

.send:disabled{
  opacity:.35;
}

/* HISTORY DRAWER */

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.56);
  opacity:0;
  pointer-events:none;
  transition:.22s;
  z-index:50;
}

.overlay.open{
  opacity:1;
  pointer-events:auto;
}

.drawer{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:min(88%,370px);
  padding:max(20px,env(safe-area-inset-top)) 14px 20px;
  background:#0d131b;
  border-right:1px solid var(--line);
  transform:translateX(-102%);
  transition:.25s ease;
  z-index:60;
  overflow-y:auto;
}

.drawer.open{
  transform:translateX(0);
}

.drawerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.drawerTitle{
  font-size:22px;
  font-weight:900;
}

.closeDrawer{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:#18212d;
  color:white;
  font-size:21px;
}

.newChatLarge{
  width:100%;
  padding:14px;
  border:1px solid rgba(24,231,161,.35);
  border-radius:15px;
  background:var(--greenSoft);
  color:var(--green);
  font-weight:850;
  margin-bottom:18px;
}

.historyHeading{
  margin:8px 4px 10px;
  color:var(--muted);
  font-size:12px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.historyItem{
  width:100%;
  text-align:left;
  padding:13px;
  margin-bottom:7px;
  border:1px solid transparent;
  border-radius:14px;
  background:#131b25;
  color:white;
}

.historyItem.active{
  border-color:rgba(24,231,161,.35);
  background:rgba(24,231,161,.08);
}

.historyTitle{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:800;
}

.historyDate{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.emptyHistory{
  padding:20px 8px;
  color:var(--muted);
  text-align:center;
  line-height:1.5;
}

</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="headerRow">

      <button
        class="iconButton"
        id="historyButton"
        aria-label="Chat history"
      >
        ☰
      </button>

      <div class="brand">
        <div class="brandName">
          NOVA <span>GUITAR AI</span>
        </div>

        <div class="online">
          <span class="onlineDot"></span>
          Ready to play
        </div>
      </div>

      <button
        class="iconButton"
        id="newChatButton"
        aria-label="New chat"
      >
        +
      </button>

    </div>
  </header>


  <main class="chat" id="chat">

    <section class="intro" id="intro">

      <div class="aiIdentity">

        <div class="avatar">♪</div>

        <div>
          <div class="aiTitle">Nova</div>
          <div class="aiSubtitle">
            Your personal guitar AI
          </div>
        </div>

      </div>

      <h1>
        What do you want to
        <span>play?</span>
      </h1>

      <div class="introText">
        Talk naturally with Nova.
        Ask about chords, songs, technique,
        theory, practice or anything you're
        trying to understand.
      </div>

    </section>


    <div id="conversation"></div>


    <div
      class="suggestions"
      id="suggestions"
    >

      <button
        class="suggestion"
        data-prompt="I'm a complete beginner"
      >
        I'm a beginner
      </button>

      <button
        class="suggestion"
        data-prompt="Teach me a guitar chord"
      >
        Learn a chord
      </button>

      <button
        class="suggestion"
        data-prompt="Give me a practice session"
      >
        Start practice
      </button>

      <button
        class="suggestion"
        data-prompt="Help me learn a song"
      >
        Learn a song
      </button>

    </div>

  </main>


  <div class="composerArea">

    <div class="composer">

      <button
        class="composerButton mic"
        id="micButton"
        aria-label="Voice"
      >
        🎙
      </button>

      <textarea
        id="input"
        rows="1"
        placeholder="Message Nova..."
      ></textarea>

      <button
        class="composerButton send"
        id="sendButton"
        disabled
      >
        ↑
      </button>

    </div>

  </div>


  <div
    class="overlay"
    id="overlay"
  ></div>


  <aside
    class="drawer"
    id="drawer"
  >

    <div class="drawerTop">

      <div class="drawerTitle">
        Chats
      </div>

      <button
        class="closeDrawer"
        id="closeDrawer"
      >
        ×
      </button>

    </div>


    <button
      class="newChatLarge"
      id="drawerNewChat"
    >
      + New chat
    </button>


    <div class="historyHeading">
      Recent
    </div>


    <div id="historyList"></div>

  </aside>

</div>


<script>

/*
=========================================================
NOVA GUITAR AI
Conversation + History Prototype

This version provides:

✓ multi-message conversations
✓ previous-message context
✓ saved chats
✓ chat history
✓ reopening old conversations
✓ automatic titles
✓ casual abbreviation normalization
✓ basic typo interpretation
✓ persistent local browser storage

IMPORTANT:

The response generator below is still a temporary
local brain.

It is NOT the final Nova generative language model.

The conversation architecture is deliberately designed
so that the final Nova model can later receive the
entire conversation array.
=========================================================
*/


const STORAGE_KEY =
  "nova_guitar_chats_v2";


const conversation =
  document.getElementById("conversation");

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const sendButton =
  document.getElementById("sendButton");

const suggestions =
  document.getElementById("suggestions");

const historyButton =
  document.getElementById("historyButton");

const drawer =
  document.getElementById("drawer");

const overlay =
  document.getElementById("overlay");

const closeDrawer =
  document.getElementById("closeDrawer");

const historyList =
  document.getElementById("historyList");

const newChatButton =
  document.getElementById("newChatButton");

const drawerNewChat =
  document.getElementById("drawerNewChat");

const micButton =
  document.getElementById("micButton");


let chats =
  loadChats();


let currentChatId = null;


/* =====================================================
   ABBREVIATIONS

   These are INPUT NORMALIZATION.

   The user's original message is still displayed and
   saved exactly as typed.

   Nova receives the interpreted form.
===================================================== */

const abbreviations = {

  "idk":"i don't know",
  "idc":"i don't care",
  "imo":"in my opinion",
  "imho":"in my humble opinion",
  "btw":"by the way",
  "rn":"right now",
  "bc":"because",
  "bcs":"because",
  "cuz":"because",
  "coz":"because",
  "pls":"please",
  "plz":"please",
  "thx":"thanks",
  "ty":"thank you",
  "np":"no problem",
  "nvm":"never mind",
  "omg":"oh my god",
  "tbh":"to be honest",
  "asap":"as soon as possible",
  "wym":"what do you mean",
  "wdym":"what do you mean",
  "ikr":"i know right",
  "irl":"in real life",
  "brb":"be right back",
  "gtg":"got to go",
  "g2g":"got to go",
  "lol":"laughing",
  "lmao":"laughing",
  "k":"okay",
  "kk":"okay",
  "yep":"yes",
  "yup":"yes",
  "yeah":"yes",
  "nah":"no",
  "nope":"no"
};


/* =====================================================
   COMMON GUITAR / CASUAL TYPOS

   This is intentionally conservative.

   We don't want Nova nagging the user about every
   informal spelling.
===================================================== */

const commonTypos = {

  "gutar":"guitar",
  "guiter":"guitar",
  "guitor":"guitar",

  "chrod":"chord",
  "cord":"chord",
  "chrods":"chords",
  "cords":"chords",

  "strng":"string",
  "stirng":"string",
  "strngs":"strings",

  "struming":"strumming",
  "struming":"strumming",

  "fretbord":"fretboard",
  "fretbaord":"fretboard",

  "begginer":"beginner",
  "beginer":"beginner",
  "begginner":"beginner",

  "practiseing":"practising",
  "practicingg":"practising",

  "wht":"what",
  "wat":"what",

  "dont":"don't",
  "cant":"can't",
  "wont":"won't",

  "im":"i'm",

  "whats":"what's",

  "doesnt":"doesn't",

  "didnt":"didn't",

  "isnt":"isn't",

  "arent":"aren't"
};


/* =====================================================
   NORMALIZE TEXT
===================================================== */

function understandText(text){

  const original =
    text.trim();


  let words =
    original
      .toLowerCase()
      .split(/(\s+|[.,!?;:]+)/);


  let corrections = [];


  words =
    words.map(part => {

      const key =
        part.toLowerCase();


      if(abbreviations[key]){

        return abbreviations[key];
      }


      if(commonTypos[key]){

        corrections.push({
          from:part,
          to:commonTypos[key]
        });


        return commonTypos[key];
      }


      return part;
    });


  return {

    original,

    understood:
      words.join("").trim(),

    corrections

  };
}


/* =====================================================
   STORAGE
===================================================== */

function loadChats(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(!saved){
      return [];
    }


    const parsed =
      JSON.parse(saved);


    return Array.isArray(parsed)
      ? parsed
      : [];

  }catch(error){

    return [];
  }
}


function saveChats(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(chats)
    );

  }catch(error){

    console.warn(
      "Nova couldn't save chats.",
      error
    );
  }


  renderHistory();
}


/* =====================================================
   CREATE CHAT
===================================================== */

function createChat(){

  const chatObject = {

    id:
      "chat_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,8),

    title:
      "New guitar chat",

    createdAt:
      Date.now(),

    updatedAt:
      Date.now(),

    messages:[]
  };


  chats.unshift(
    chatObject
  );


  currentChatId =
    chatObject.id;


  saveChats();

  renderCurrentChat();

  closeHistory();

  input.focus();
}


/* =====================================================
   CURRENT CHAT
===================================================== */

function getCurrentChat(){

  return chats.find(
    item =>
      item.id ===
      currentChatId
  );
}


/* =====================================================
   AUTO TITLE
===================================================== */

function makeChatTitle(text){

  let clean =
    text
      .replace(/\s+/g," ")
      .trim();


  if(clean.length > 34){

    clean =
      clean.slice(0,34)
      .trim() +
      "…";
  }


  return clean ||
    "Guitar chat";
}


/* =====================================================
   ADD MESSAGE TO CHAT DATA
===================================================== */

function storeMessage(
  role,
  content,
  interpreted = null
){

  const active =
    getCurrentChat();


  if(!active){
    return;
  }


  active.messages.push({

    role,

    content,

    interpreted,

    time:
      Date.now()

  });


  active.updatedAt =
    Date.now();


  /*
  First user message becomes title.
  */

  if(
    role === "user" &&
    active.messages.filter(
      message =>
        message.role === "user"
    ).length === 1
  ){

    active.title =
      makeChatTitle(content);
  }


  /*
  Put most recently used chat first.
  */

  chats.sort(
    (a,b) =>
      b.updatedAt -
      a.updatedAt
  );


  saveChats();
}


/* =====================================================
   SEND MESSAGE
===================================================== */

function sendCurrentMessage(){

  const text =
    input.value.trim();


  if(!text){
    return;
  }


  input.value = "";

  resizeInput();

  sendButton.disabled = true;


  sendUserMessage(text);
}


function sendUserMessage(text){

  if(!currentChatId){
    createChat();
  }


  const interpretation =
    understandText(text);


  storeMessage(
    "user",
    interpretation.original,
    interpretation.understood
  );


  renderCurrentChat();

  showThinking();

  scrollToBottom();


  /*
  TEMPORARY local response.

  Later this is where the full conversation
  will be sent to the real Nova model.
  */

  setTimeout(() => {

    removeThinking();


    const active =
      getCurrentChat();


    const reply =
      novaBrain(
        active.messages,
        interpretation
      );


    storeMessage(
      "assistant",
      reply
    );


    renderCurrentChat();

    scrollToBottom();

  },500);
}


/* =====================================================
   RENDER CHAT
===================================================== */

function renderCurrentChat(){

  conversation.innerHTML = "";


  const active =
    getCurrentChat();


  if(
    !active ||
    active.messages.length === 0
  ){

    suggestions.style.display =
      "flex";

    return;
  }


  suggestions.style.display =
    "none";


  active.messages.forEach(
    message => {

      renderMessage(
        message.role,
        message.content
      );
    }
  );


  scrollToBottom();
}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(
  role,
  text
){

  const sender =
    role === "assistant"
      ? "nova"
      : "user";


  if(sender === "nova"){

    const label =
      document.createElement("div");

    label.className =
      "novaLabel";

    label.textContent =
      "Nova";

    conversation.appendChild(
      label
    );
  }


  const row =
    document.createElement("div");

  row.className =
    "messageRow " +
    sender;


  const bubble =
    document.createElement("div");

  bubble.className =
    "message";

  bubble.textContent =
    text;


  row.appendChild(
    bubble
  );


  conversation.appendChild(
    row
  );
}


/* =====================================================
   THINKING
===================================================== */

function showThinking(){

  removeThinking();


  const row =
    document.createElement("div");

  row.className =
    "messageRow nova";

  row.id =
    "thinkingRow";


  const bubble =
    document.createElement("div");

  bubble.className =
    "message";


  bubble.innerHTML =
    '<span class="thinking">' +
    '<i></i><i></i><i></i>' +
    '</span>';


  row.appendChild(
    bubble
  );


  conversation.appendChild(
    row
  );
}


function removeThinking(){

  const old =
    document.getElementById(
      "thinkingRow"
    );


  if(old){
    old.remove();
  }
}


/* =====================================================
   CONVERSATIONAL CONTEXT HELPERS
===================================================== */

function previousAssistantMessage(
  messages
){

  for(
    let i =
      messages.length - 2;
    i >= 0;
    i--
  ){

    if(
      messages[i].role ===
      "assistant"
    ){

      return messages[i].content;
    }
  }


  return "";
}


function previousUserMessage(
  messages
){

  let foundLatest = false;


  for(
    let i =
      messages.length - 1;
    i >= 0;
    i--
  ){

    if(
      messages[i].role ===
      "user"
    ){

      if(foundLatest){
        return messages[i].content;
      }


      foundLatest = true;
    }
  }


  return "";
}


/* =====================================================
   TEMPORARY NOVA BRAIN

   THIS IS NOT THE FINAL AI.

   Unlike the previous demonstration, this receives
   the WHOLE conversation.

   That means short replies such as:
   "yes"
   "no"
   "idk"
   "the second one"
   can at least use preceding context.

   The final generative Nova model will replace
   this function entirely.
===================================================== */

function novaBrain(
  messages,
  interpretation
){

  const text =
    interpretation.understood
      .toLowerCase();


  const previousNova =
    previousAssistantMessage(
      messages
    ).toLowerCase();


  /*
  ---------------------------------------------
  CONTEXTUAL YES
  ---------------------------------------------
  */

  if(
    text === "yes" ||
    text === "yes." ||
    text === "okay" ||
    text === "ok"
  ){

    if(
      previousNova.includes(
        "start with em"
      ) ||
      previousNova.includes(
        "want to learn em"
      )
    ){

      return (
        "Great — let's start with Em.\n\n" +

        "Put one finger on the 2nd fret of the A string and another on the 2nd fret of the D string. Leave the other strings open, then gently strum all six strings.\n\n" +

        "Listen for six clear notes. If one sounds muted or buzzy, tell me which one."
      );
    }


    if(
      previousNova.includes(
        "practice"
      )
    ){

      return (
        "Great. We'll do it together. Start slowly and don't worry about speed yet. Tell me when you're ready for the first exercise."
      );
    }


    return (
      "Got it. Tell me what you'd like to do next."
    );
  }


  /*
  ---------------------------------------------
  IDK / I DON'T KNOW

  Because IDK was normalized before reaching here,
  both forms behave the same way.
  ---------------------------------------------
  */

  if(
    text.includes(
      "i don't know"
    )
  ){

    if(
      previousNova.includes(
        "em"
      )
    ){

      return (
        "That's okay — I'll choose for us. Let's start with Em because it's one of the simplest full guitar chords and gives you a good first feel for fretting and strumming."
      );
    }


    return (
      "That's fine — I can guide you. If you're starting from scratch, we'll begin with the basics and take it one step at a time."
    );
  }


  /*
  ---------------------------------------------
  BEGINNER
  ---------------------------------------------
  */

  if(
    text.includes(
      "beginner"
    )
  ){

    return (
      "Perfect. We can start right from the beginning and build from there.\n\n" +

      "I'd begin with how to hold the guitar comfortably, then one simple chord, and then your first chord change.\n\n" +

      "Would you like to start with Em?"
    );
  }


  /*
  ---------------------------------------------
  EM
  ---------------------------------------------
  */

  if(
    /\bem\b/.test(text) ||
    text.includes(
      "e minor"
    )
  ){

    return (
      "For Em, place two fingers on the 2nd fret: one on the A string and one on the D string. The remaining strings stay open.\n\n" +

      "Strum all six strings slowly. Each one should ring clearly."
    );
  }


  /*
  ---------------------------------------------
  DM
  ---------------------------------------------
  */

  if(
    /\bdm\b/.test(text) ||
    text.includes(
      "d minor"
    )
  ){

    return (
      "For D minor, put your index finger on the 1st fret of the high E string, middle finger on the 2nd fret of G, and ring finger on the 3rd fret of B.\n\n" +

      "Strum from the D string downward."
    );
  }


  /*
  ---------------------------------------------
  CHORD
  ---------------------------------------------
  */

  if(
    text.includes(
      "chord"
    )
  ){

    return (
      "Absolutely. Which chord are you working on? You can give me its name — Em, G, C, D, Am, Dm, F, or another one — and we'll work through it together."
    );
  }


  /*
  ---------------------------------------------
  PRACTICE
  ---------------------------------------------
  */

  if(
    text.includes("practice") ||
    text.includes("practise")
  ){

    return (
      "We can build a practice session around your actual level rather than giving everyone the same routine.\n\n" +

      "Are you a complete beginner, do you already know a few chords, or can you already play some songs?"
    );
  }


  /*
  ---------------------------------------------
  SONG
  ---------------------------------------------
  */

  if(
    text.includes(
      "song"
    )
  ){

    return (
      "Tell me which song. Then tell me roughly what you can already play, and I'll break it into manageable parts rather than dumping the whole thing on you."
    );
  }


  /*
  ---------------------------------------------
  BANANA / OFF-TOPIC EXAMPLE

  Nova can answer normally, then naturally
  reconnect to its guitar role.
  ---------------------------------------------
  */

  if(
    text.includes(
      "banana"
    )
  ){

    return (
      "A banana is an edible fruit that grows in clusters on large flowering plants. It's usually eaten when the peel turns yellow, although there are many varieties.\n\n" +

      "Anyway — I'm your guitar AI. What are we playing today?"
    );
  }


  /*
  ---------------------------------------------
  WHAT DO YOU MEAN
  ---------------------------------------------
  */

  if(
    text.includes(
      "what do you mean"
    )
  ){

    if(previousNova){

      return (
        "I mean the last thing I was explaining. Tell me which part wasn't clear and I'll explain it in a simpler way."
      );
    }
  }


  /*
  ---------------------------------------------
  DEFAULT

  Temporary only.

  The future generative model removes the need
  for this fallback.
  ---------------------------------------------
  */

  return (
    "I understand what you're asking, but this prototype is still using Nova's temporary local conversation brain.\n\n" +

    "The next stage is connecting the generative Nova model so I can answer freely rather than relying on programmed examples."
  );
}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

  historyList.innerHTML = "";


  if(chats.length === 0){

    const empty =
      document.createElement("div");

    empty.className =
      "emptyHistory";

    empty.textContent =
      "Your Nova conversations will appear here.";

    historyList.appendChild(
      empty
    );

    return;
  }


  chats
    .sort(
      (a,b) =>
        b.updatedAt -
        a.updatedAt
    )
    .forEach(item => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "historyItem";


      if(
        item.id ===
        currentChatId
      ){

        button.classList.add(
          "active"
        );
      }


      const title =
        document.createElement(
          "div"
        );

      title.className =
        "historyTitle";

      title.textContent =
        item.title;


      const date =
        document.createElement(
          "div"
        );

      date.className =
        "historyDate";

      date.textContent =
        formatDate(
          item.updatedAt
        );


      button.appendChild(title);

      button.appendChild(date);


      button.addEventListener(
        "click",
        () => {

          currentChatId =
            item.id;

          renderCurrentChat();

          renderHistory();

          closeHistory();
        }
      );


      historyList.appendChild(
        button
      );
    });
}


/* =====================================================
   DATE
===================================================== */

function formatDate(timestamp){

  const date =
    new Date(timestamp);


  const today =
    new Date();


  if(
    date.toDateString() ===
    today.toDateString()
  ){

    return (
      "Today • " +
      date.toLocaleTimeString(
        [],
        {
          hour:"numeric",
          minute:"2-digit"
        }
      )
    );
  }


  return date.toLocaleDateString(
    [],
    {
      day:"numeric",
      month:"short"
    }
  );
}


/* =====================================================
   DRAWER
===================================================== */

function openHistory(){

  renderHistory();

  drawer.classList.add(
    "open"
  );

  overlay.classList.add(
    "open"
  );
}


function closeHistory(){

  drawer.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "open"
  );
}


historyButton.addEventListener(
  "click",
  openHistory
);


closeDrawer.addEventListener(
  "click",
  closeHistory
);


overlay.addEventListener(
  "click",
  closeHistory
);


/* =====================================================
   NEW CHAT
===================================================== */

newChatButton.addEventListener(
  "click",
  createChat
);


drawerNewChat.addEventListener(
  "click",
  createChat
);


/* =====================================================
   SUGGESTIONS
===================================================== */

document
  .querySelectorAll(
    ".suggestion"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        sendUserMessage(
          button.dataset.prompt
        );
      }
    );
  });


/* =====================================================
   INPUT
===================================================== */

input.addEventListener(
  "input",
  () => {

    resizeInput();

    sendButton.disabled =
      !input.value.trim();
  }
);


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendCurrentMessage();
    }
  }
);


sendButton.addEventListener(
  "click",
  sendCurrentMessage
);


/* =====================================================
   MICROPHONE

   Deliberately NOT reconnecting the inaccurate
   tuner yet.
===================================================== */

micButton.addEventListener(
  "click",
  () => {

    if(!currentChatId){
      createChat();
    }


    storeMessage(
      "assistant",
      "Voice and guitar listening will plug into this button later. For now, type to me here."
    );


    renderCurrentChat();
  }
);


/* =====================================================
   TEXTAREA
===================================================== */

function resizeInput(){

  input.style.height =
    "auto";


  input.style.height =
    Math.min(
      input.scrollHeight,
      130
    ) +
    "px";
}


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom(){

  requestAnimationFrame(
    () => {

      chat.scrollTo({
        top:chat.scrollHeight,
        behavior:"smooth"
      });
    }
  );
}


/* =====================================================
   STARTUP
===================================================== */

/*
If there is already a saved chat,
open the most recently used one.

Otherwise create a fresh conversation.
*/

if(chats.length > 0){

  chats.sort(
    (a,b) =>
      b.updatedAt -
      a.updatedAt
  );


  currentChatId =
    chats[0].id;


  renderCurrentChat();

}else{

  createChat();
}


renderHistory();

</script>
