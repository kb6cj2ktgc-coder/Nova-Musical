<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101416">
<title>Nova Musical — Guitar Tuner</title>

<style>
:root{
  --bg:#101416;
  --panel:#171c1f;
  --white:#f7f7f7;
  --muted:#8c9297;
  --green:#16d59a;
  --yellow:#e6d94d;
  --red:#ff4c5d;
  --grey:#777d81;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.app{
  width:min(100%,760px);
  margin:auto;
  padding:18px 14px 45px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px;
}

.back{
  color:#d0d4d6;
  text-decoration:none;
  font-size:27px;
  font-weight:800;
}

.logo{
  flex:1;
  font-size:22px;
  font-weight:950;
}

.logo span{color:var(--green)}

.auto-control{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:800;
}

.auto-box{
  width:30px;
  height:30px;
  border:2px solid #858b8f;
  border-radius:8px;
  background:#252a2d;
  display:grid;
  place-items:center;
  cursor:pointer;
}

.auto-box.on{
  background:var(--green);
  border-color:var(--green);
  color:#06150f;
}

.auto-box.on::after{
  content:"✓";
  font-size:19px;
  font-weight:1000;
}

h1{
  margin:0;
  text-align:center;
  font-size:30px;
}

.subtitle{
  margin:7px 0 20px;
  text-align:center;
  color:var(--muted);
}

.tuner{
  overflow:hidden;
  border:1px solid #ffffff12;
  border-radius:25px;
  background:var(--panel);
}

/* METER */

.meter{
  position:relative;
  height:220px;
  border-bottom:1px solid #ffffff10;
  background:
    linear-gradient(#ffffff07 1px,transparent 1px),
    linear-gradient(90deg,#ffffff07 1px,transparent 1px);
  background-size:32px 32px;
}

.track{
  position:absolute;
  left:8%;
  right:8%;
  top:75px;
  height:2px;
  background:#ffffff22;
}

.tick{
  position:absolute;
  top:59px;
  width:2px;
  height:34px;
  background:#e8e9e9;
}

.tick.big{
  top:48px;
  height:56px;
}

.target{
  position:absolute;
  left:50%;
  top:42px;
  transform:translateX(-50%);
  width:62px;
  height:68px;
  overflow:hidden;
  border:2px solid #a9adaf;
  border-radius:7px;
  background:#707579;
}

.fill{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:0%;
  background:var(--green);
  transition:height .12s linear;
}

.center{
  position:absolute;
  left:50%;
  top:38px;
  width:3px;
  height:78px;
  transform:translateX(-50%);
  background:white;
  z-index:4;
}

.needle{
  position:absolute;
  left:50%;
  top:36px;
  width:5px;
  height:82px;
  transform:translateX(-50%);
  border-radius:4px;
  background:var(--grey);
  z-index:5;

  /* visual smoothing only */
  transition:
    left .22s cubic-bezier(.22,.61,.36,1),
    background .15s ease;
}

.number{
  position:absolute;
  top:126px;
  left:50%;
  transform:translateX(-50%);
  font-size:36px;
  font-weight:950;
}

.instruction{
  position:absolute;
  top:174px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:17px;
  font-weight:850;
}

/* GUITAR */

.guitar{
  position:relative;
  width:min(100%,650px);
  height:370px;
  margin:12px auto 0;
}

.wood{
  position:absolute;
  left:6%;
  top:66px;
  width:72%;
  height:230px;

  clip-path:polygon(
    0 22%,8% 5%,64% 8%,80% 17%,100% 28%,
    100% 72%,80% 83%,64% 92%,8% 95%,0 78%
  );

  background:
    repeating-linear-gradient(
      1deg,
      rgba(255,255,255,.025) 0,
      rgba(255,255,255,.025) 2px,
      rgba(0,0,0,.035) 3px,
      rgba(0,0,0,.035) 5px
    ),
    linear-gradient(
      90deg,
      #623014,
      #a45b27 43%,
      #783b1a 78%,
      #4a2515
    );

  box-shadow:
    inset 0 0 38px #0008,
    0 15px 40px #0007;
}

.wood::after{
  content:"N";
  position:absolute;
  left:16%;
  top:50%;
  transform:translateY(-50%);
  color:#27130655;
  font-size:58px;
  font-weight:1000;
}

.neck{
  position:absolute;
  left:75%;
  right:0;
  top:126px;
  height:110px;
  background:linear-gradient(#38241a,#60402c 50%,#352219);
  box-shadow:inset 0 0 15px #0008;
  z-index:2;
}

.nut{
  position:absolute;
  left:75%;
  top:126px;
  width:8px;
  height:110px;
  background:#eee8dc;
  z-index:7;
}

.fret{
  position:absolute;
  top:126px;
  width:2px;
  height:110px;
  background:#b69b67;
  z-index:3;
}

.fret1{right:12%}
.fret2{right:4%}

/* STRINGS */

.string-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:8;
  pointer-events:none;
}

.guitar-string{
  fill:none;
  stroke:#c9cccd;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:stroke .14s,filter .14s;
}

.s2{stroke-width:1.9}
.s3{stroke-width:2.2}
.s4{stroke-width:2.5}
.s5{stroke-width:2.8}
.s6{stroke-width:3.2}

.guitar-string.bad{
  stroke:var(--red);
  filter:drop-shadow(0 0 5px var(--red));
}

.guitar-string.good{
  stroke:var(--green);
  filter:drop-shadow(0 0 6px var(--green));
}

/* PEGS */

.peg{
  position:absolute;
  width:44px;
  height:44px;
  border-radius:50%;
  z-index:10;
  border:2px solid #aeb2b4;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff 0,
      #daddde 18%,
      #8b9092 44%,
      #45494b 70%,
      #c5c8c9 73%,
      #55595b 100%
    );
}

.peg::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:13px;
  height:13px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#d8dbdc;
  border:2px solid #5c6062;
}

.p3{left:29%;top:83px}
.p2{left:45%;top:83px}
.p1{left:61%;top:83px}

.p4{left:29%;top:235px}
.p5{left:45%;top:235px}
.p6{left:61%;top:235px}

.peg.bad{
  border-color:var(--red);
  box-shadow:0 0 16px var(--red);
}

.peg.good{
  border-color:var(--green);
  box-shadow:0 0 17px var(--green);
}

/* STRING BUTTONS */

.string-choice{
  position:absolute;
  width:55px;
  height:48px;
  border:2px solid #e3e5e6;
  border-radius:17px;
  background:#171c1f;
  color:white;
  font-size:20px;
  font-weight:900;
  z-index:12;
}

.c3{left:28.2%;top:27px}
.c2{left:44.2%;top:27px}
.c1{left:60.2%;top:27px}

.c4{left:28.2%;top:293px}
.c5{left:44.2%;top:293px}
.c6{left:60.2%;top:293px}

.string-choice.active{
  background:white;
  color:#14181a;
}

.string-choice.bad{
  background:var(--red);
  border-color:var(--red);
}

.string-choice.good{
  background:var(--green);
  border-color:var(--green);
  color:#061a12;
  box-shadow:0 0 18px #16d59a99;
}

.controls{
  padding:8px 18px 24px;
}

.start{
  width:100%;
  padding:16px;
  border:0;
  border-radius:16px;
  background:var(--green);
  color:#06150f;
  font-size:16px;
  font-weight:900;
}

.status{
  margin-top:13px;
  min-height:20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.complete{
  display:none;
  margin-top:14px;
  padding:14px;
  border:1px solid #16d59a66;
  border-radius:14px;
  background:#16d59a12;
  color:var(--green);
  text-align:center;
  font-weight:900;
}

@media(max-width:520px){
  .guitar{height:340px}
}
</style>
</head>

preserveAspectRatio="none">

<path
id="string1"
class="guitar-string s1"
d="M419 105 L490 150 L650 150"/>

id="string3"

<script>

/* ======================================
   NOVA MUSICAL PRECISION TUNER
   McLeod-style pitch detector
====================================== */

const GUITAR=[
 {number:6,label:"E",name:"Low E",hz:82.4069},
 {number:5,label:"A",name:"A",hz:110},
 {number:4,label:"D",name:"D",hz:146.8324},
 {number:3,label:"G",name:"G",hz:195.9977},
 {number:2,label:"B",name:"B",hz:246.9417},
 {number:1,label:"E",name:"High E",hz:329.6276}
];

const startButton=document.getElementById("start");
const autoBox=document.getElementById("autoBox");
const needle=document.getElementById("needle");
const numberDisplay=document.getElementById("number");
const instruction=document.getElementById("instruction");
const fill=document.getElementById("fill");
const status=document.getElementById("status");
const title=document.getElementById("title");
const complete=document.getElementById("complete");

const choiceButtons=[
 ...document.querySelectorAll(".string-choice")
];

let automatic=true;
let selectedString=null;

let audioContext=null;
let analyser=null;
let stream=null;
let buffer=null;
let running=false;

let currentCandidate=null;
let candidateCount=0;

let recentCents=[];
let recentPitch=[];

let stableStart=null;
let stableString=null;

let displayedNeedle=0;

let lastAnalysis=0;
let lastPitchTime=0;

const tuned=new Set();

/* ======================================
   MODE
====================================== */

function toggleAutomatic(){

 automatic=!automatic;

 autoBox.classList.toggle("on",automatic);

 autoBox.setAttribute(
   "aria-checked",
   automatic?"true":"false"
 );

 selectedString=null;

 resetTracking();
 resetConfirmation();
 clearActive();

 title.textContent="Tune your guitar";

 if(automatic){

   instruction.textContent=
     running
     ?"Play any open string"
     :"Start tuning and play any string";

   status.textContent=
     "Automatic detection is on.";

 }else{

   instruction.textContent=
     "Choose a string to tune";

   status.textContent=
     "Choose E, A, D, G, B or E.";
 }
}

autoBox.addEventListener(
 "click",
 toggleAutomatic
);

/* ======================================
   MANUAL SELECTION
====================================== */

choiceButtons.forEach(button=>{

 button.addEventListener("click",()=>{

   const number=
     Number(button.dataset.string);

   selectedString=
     GUITAR.find(
       s=>s.number===number
     );

   automatic=false;

   autoBox.classList.remove("on");

   autoBox.setAttribute(
     "aria-checked",
     "false"
   );

   resetTracking();
   resetConfirmation();
   clearActive();

   if(!tuned.has(number)){
     button.classList.add("active");
   }

   title.textContent=
     "Tune "+selectedString.name;

   instruction.textContent=
     "Play "+selectedString.name;

   status.textContent=
     "Listening for "+selectedString.name+".";
 });
});

/* ======================================
   MICROPHONE
====================================== */

startButton.addEventListener(
 "click",
 async()=>{

 if(running){
   stopTuner();
   return;
 }

 try{

   stream=
     await navigator.mediaDevices
     .getUserMedia({
       audio:{
         echoCancellation:false,
         noiseSuppression:false,
         autoGainControl:false,
         channelCount:1
       }
     });

   audioContext=
     new(
       window.AudioContext ||
       window.webkitAudioContext
     )();

   await audioContext.resume();

   const source=
     audioContext
     .createMediaStreamSource(stream);

   analyser=
     audioContext.createAnalyser();

   /*
     16384 samples gives Low E
     substantially more waveform cycles
     than a tiny tuner buffer.
   */

   analyser.fftSize=16384;
   analyser.smoothingTimeConstant=0;

   buffer=
     new Float32Array(
       analyser.fftSize
     );

   source.connect(analyser);

   running=true;

   startButton.textContent=
     "Stop tuning";

   status.textContent="Listening…";

   instruction.textContent=
     automatic
     ?"Play any open string"
     :selectedString
       ?"Play "+selectedString.name
       :"Choose a string to tune";

   requestAnimationFrame(listen);

 }catch(error){

   status.textContent=
     "Please allow microphone access.";
 }
});

function stopTuner(){

 running=false;

 if(stream){
   stream.getTracks().forEach(
     track=>track.stop()
   );
 }

 if(audioContext){
   audioContext.close();
 }

 stream=null;
 audioContext=null;

 startButton.textContent=
   "Start tuning";

 status.textContent=
   "Microphone is off.";
}

/* ======================================
   ANALYSIS LOOP
====================================== */

function listen(timestamp){

 if(!running)return;

 /*
   14-ish analyses per second.
   Fast enough to feel live without
   reacting to every tiny waveform
   disturbance.
 */

 if(timestamp-lastAnalysis>=70){

   lastAnalysis=timestamp;

   analyser.getFloatTimeDomainData(buffer);

   const level=rms(buffer);

   if(level>.004){

     const result=
       mcleodPitch(
         buffer,
         audioContext.sampleRate
       );

     if(
       result &&
       result.clarity>=.86
     ){

       lastPitchTime=timestamp;

       if(automatic){
         processAutomatic(result);
       }else if(selectedString){
         processManual(result);
       }
     }

   }else if(
     timestamp-lastPitchTime>500
   ){

     /*
       A new pluck should start fresh.
       Don't let the previous Low E
       contaminate the next G/A/D etc.
     */

     resetTracking();
     resetConfirmation();
   }
 }

 requestAnimationFrame(listen);
}

/* ======================================
   LEVEL
====================================== */

function rms(data){

 let sum=0;

 for(let i=0;i<data.length;i++){
   sum+=data[i]*data[i];
 }

 return Math.sqrt(
   sum/data.length
 );
}

/* ======================================
   McLEOD PITCH METHOD

   Normalized Square Difference Function
   + key maximum selection.

   The pitch is discovered independently.
   It is NOT told which guitar string
   we want.
====================================== */

function mcleodPitch(
 samples,
 sampleRate
){

 const minFrequency=65;
 const maxFrequency=400;

 const minLag=
   Math.floor(
     sampleRate/maxFrequency
   );

 const maxLag=
   Math.ceil(
     sampleRate/minFrequency
   );

 /*
   Use a long central section but keep
   the computation reasonable on iPhone.
 */

 const N=Math.min(
   8192,
   samples.length-maxLag-1
 );

 if(N<3000){
   return null;
 }

 /*
   Remove DC offset.
 */

 let mean=0;

 for(let i=0;i<N+maxLag;i++){
   mean+=samples[i];
 }

 mean/=(N+maxLag);

 /*
   Normalized Square Difference Function.

   NSDF =
   2 * correlation /
   (energy1 + energy2)
 */

 const nsdf=
   new Float64Array(
     maxLag+2
   );

 for(
   let lag=minLag;
   lag<=maxLag;
   lag++
 ){

   let acf=0;
   let divisor=0;

   /*
     Step 2 is enough for the waveform
     comparison while making this much
     more practical on a phone.
   */

   for(
     let i=0;
     i<N;
     i+=2
   ){

     const a=
       samples[i]-mean;

     const b=
       samples[i+lag]-mean;

     acf+=a*b;

     divisor+=
       a*a+
       b*b;
   }

   nsdf[lag]=
     divisor>0
     ?2*acf/divisor
     :0;
 }

 /*
   Find positive local maxima.
 */

 const peaks=[];

 let positive=false;

 for(
   let lag=minLag+1;
   lag<maxLag;
   lag++
 ){

   if(nsdf[lag]>0){
     positive=true;
   }

   if(
     positive &&
     nsdf[lag]>=nsdf[lag-1] &&
     nsdf[lag]>nsdf[lag+1]
   ){

     peaks.push({
       lag,
       value:nsdf[lag]
     });
   }

   if(nsdf[lag]<0){
     positive=false;
   }
 }

 if(!peaks.length){
   return null;
 }

 /*
   Strongest peak establishes the
   reference quality.
 */

 let strongest=peaks[0];

 for(const peak of peaks){

   if(peak.value>strongest.value){
     strongest=peak;
   }
 }

 if(strongest.value<.72){
   return null;
 }

 /*
   McLeod-style peak picking:

   Take the FIRST important peak whose
   strength is close to the strongest
   peak.

   This is what helps distinguish the
   real fundamental from later period
   multiples.
 */

 const cutoff=
   strongest.value*.90;

 let chosen=null;

 for(const peak of peaks){

   if(peak.value>=cutoff){

     chosen=peak;
     break;
   }
 }

 if(!chosen){
   chosen=strongest;
 }

 let lag=chosen.lag;

 /*
   Parabolic interpolation.

   Gives fractional-lag resolution
   instead of forcing the frequency
   onto whole sample positions.
 */

 const y1=nsdf[lag-1];
 const y2=nsdf[lag];
 const y3=nsdf[lag+1];

 const denominator=
   y1-
   2*y2+
   y3;

 let refinedLag=lag;

 if(
   Math.abs(denominator)>
   .0000001
 ){

   const adjustment=
     .5*
     (y1-y3)/
     denominator;

   if(
     Number.isFinite(adjustment) &&
     Math.abs(adjustment)<=1
   ){
     refinedLag+=adjustment;
   }
 }

 const frequency=
   sampleRate/refinedLag;

 if(
   !Number.isFinite(frequency) ||
   frequency<minFrequency ||
   frequency>maxFrequency
 ){
   return null;
 }

 return{
   frequency,
   clarity:chosen.value
 };
}

/* ======================================
   DIFFERENCE
====================================== */

function centsBetween(
 frequency,
 target
){

 return(
   1200*
   Math.log2(
     frequency/target
   )
 );
}

/* ======================================
   AUTOMATIC

   IMPORTANT CHANGE:
   If candidate changes from E to G,
   history is cleared immediately.
   G is NOT averaged with the old E.
====================================== */

function processAutomatic(result){

 const pitch=result.frequency;

 let best=null;
 let smallest=Infinity;

 for(const string of GUITAR){

   const distance=
     Math.abs(
       centsBetween(
         pitch,
         string.hz
       )
     );

   if(distance<smallest){

     smallest=distance;
     best=string;
   }
 }

 /*
   Open string detection window.

   If the note is nowhere near an open
   string, don't pretend it is one.
 */

 if(!best || smallest>70){

   currentCandidate=null;
   candidateCount=0;
   recentCents=[];
   recentPitch=[];

   resetConfirmation();

   instruction.textContent=
     "Play an open string";

   instruction.style.color=
     "var(--muted)";

   return;
 }

 /*
   THIS fixes the sticky Low-E problem.

   The moment a different plausible
   string appears, previous pitch
   smoothing is discarded.
 */

 if(
   currentCandidate!==
   best.number
 ){

   currentCandidate=
     best.number;

   candidateCount=1;

   recentCents=[];
   recentPitch=[];

   resetConfirmation();

   return;

 }else{

   candidateCount++;
 }

 /*
   Only two consecutive detections
   required.

   It should switch strings quickly
   without one random harmonic doing it.
 */

 if(candidateCount<2){
   return;
 }

 const difference=
   centsBetween(
     pitch,
     best.hz
   );

 showReading(
   best,
   difference,
   false
 );
}

/* ======================================
   MANUAL

   Actual detected pitch is compared
   directly with the selected target.

   Low E + High E remains ~+2400.
====================================== */

function processManual(result){

 const pitch=result.frequency;

 const difference=
   centsBetween(
     pitch,
     selectedString.hz
   );

 const wrongString=
   Math.abs(difference)>120;

 showReading(
   selectedString,
   difference,
   wrongString
 );
}

/* ======================================
   ROBUST FILTER

   We use a short MEDIAN.

   A median ignores one crazy reading
   rather than dragging the display
   toward it.
====================================== */

function filteredDifference(value){

 recentCents.push(value);

 if(recentCents.length>5){
   recentCents.shift();
 }

 if(recentCents.length<3){
   return value;
 }

 const sorted=[
   ...recentCents
 ].sort((a,b)=>a-b);

 return sorted[
   Math.floor(
     sorted.length/2
   )
 ];
}

/* ======================================
   DISPLAY
====================================== */

function showReading(
 target,
 rawDifference,
 wrongString
){

 let difference;

 if(wrongString){

   /*
     Never average a wrong string
     together with a correct one.
   */

   recentCents=[];
   difference=rawDifference;

   resetConfirmation();

 }else{

   difference=
     filteredDifference(
       rawDifference
     );
 }

 const rounded=
   Math.round(difference);

 numberDisplay.textContent=
   rounded>0
   ?"+"+rounded
   :String(rounded);

 /*
   Visual meter is ±50.
   Actual number is NOT limited.
 */

 const visualTarget=
   Math.max(
     -50,
     Math.min(
       50,
       difference
     )
   );

 /*
   Extra visual interpolation.

   This changes only how smoothly
   the needle travels.

   It does NOT alter the measured
   tuning number.
 */

 displayedNeedle+=
   (
     visualTarget-
     displayedNeedle
   )*.42;

 needle.style.left=
   (
     50+
     (displayedNeedle/50)*42
   )+"%";

 title.textContent=
   "Tune "+target.name;

 clearActive();

 const button=
   buttonFor(target.number);

 if(!tuned.has(target.number)){
   button.classList.add("active");
 }

 if(wrongString){

   setColour("red");

   instruction.textContent=
     difference<0
     ?"Much too low"
     :"Much too high";

   setBad(target.number);

   return;
 }

 clearBad(target.number);

 const amount=
   Math.abs(difference);

 /*
   Accurate tuning zones.

   ±2 = green
   ±4 = yellow
   >4 = red

   We don't pretend +6 is tuned.
 */

 if(amount<=2){

   setColour("green");

   instruction.textContent=
     "Hold steady";

   confirmTuning(
     target,
     difference
   );

 }else if(amount<=4){

   resetConfirmation();

   setColour("yellow");

   instruction.textContent=
     difference<0
     ?"Tune up"
     :"Tune down";

 }else{

   resetConfirmation();

   setColour("red");

   instruction.textContent=
     difference<0
     ?"Tune up"
     :"Tune down";
 }
}

/* ======================================
   COLOURS
====================================== */

function setColour(type){

 let colour;

 if(type==="green"){
   colour="var(--green)";
 }

 if(type==="yellow"){
   colour="var(--yellow)";
 }

 if(type==="red"){
   colour="var(--red)";
 }

 needle.style.background=colour;
 numberDisplay.style.color=colour;
 instruction.style.color=colour;
}

/* ======================================
   CONFIRM TUNED

   We require stability, not one
   accidental zero crossing.
====================================== */

function confirmTuning(
 target,
 difference
){

 if(Math.abs(difference)>2){

   resetConfirmation();
   return;
 }

 if(tuned.has(target.number)){

   fill.style.height="100%";

   instruction.textContent=
     "In tune ✓";

   return;
 }

 if(stableString!==target.number){

   stableString=target.number;
   stableStart=performance.now();

   fill.style.height="0%";
 }

 const elapsed=
   performance.now()-
   stableStart;

 const progress=
   Math.min(
     1,
     elapsed/1800
   );

 fill.style.height=
   (progress*100)+"%";

 if(progress>=1){

   markTuned(target);

   stableStart=null;
   stableString=null;
 }
}

function resetConfirmation(){

 stableStart=null;
 stableString=null;

 fill.style.height="0%";
}

/* ======================================
   MARK TUNED
====================================== */

function markTuned(target){

 tuned.add(target.number);

 const button=
   buttonFor(target.number);

 const peg=
   document.getElementById(
     "peg"+target.number
   );

 const string=
   document.getElementById(
     "string"+target.number
   );

 button.classList.remove(
   "active",
   "bad"
 );

 peg.classList.remove("bad");
 string.classList.remove("bad");

 button.classList.add("good");
 peg.classList.add("good");
 string.classList.add("good");

 fill.style.height="100%";

 numberDisplay.textContent="0";

 setColour("green");

 instruction.textContent=
   "In tune ✓";

 status.textContent=
   target.name+" is tuned.";

 if(tuned.size===6){

   complete.style.display="block";

   title.textContent=
     "Guitar tuned ✓";
 }
}

/* ======================================
   VISUAL STRING STATES
====================================== */

function setBad(number){

 if(tuned.has(number)){
   return;
 }

 const button=buttonFor(number);

 const peg=
   document.getElementById(
     "peg"+number
   );

 const string=
   document.getElementById(
     "string"+number
   );

 button.classList.remove("active");

 button.classList.add("bad");
 peg.classList.add("bad");
 string.classList.add("bad");
}

function clearBad(number){

 if(tuned.has(number)){
   return;
 }

 const button=buttonFor(number);

 const peg=
   document.getElementById(
     "peg"+number
   );

 const string=
   document.getElementById(
     "string"+number
   );

 button.classList.remove("bad");
 peg.classList.remove("bad");
 string.classList.remove("bad");
}

function buttonFor(number){

 return document.querySelector(
   '.string-choice[data-string="'+
   number+
   '"]'
 );
}

function clearActive(){

 choiceButtons.forEach(button=>{

   const number=
     Number(button.dataset.string);

   if(!tuned.has(number)){
     button.classList.remove("active");
   }
 });
}

function resetTracking(){

 currentCandidate=null;
 candidateCount=0;

 recentCents=[];
 recentPitch=[];

 displayedNeedle=0;
}

/*
  Session state deliberately disappears
  on refresh/exit.
*/

</script>

</body>
</html>
