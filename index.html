<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<title>Nova Musical — Guitar Tuner</title>

<style>
:root{
  --bg:#0b0e11;
  --panel:#15191d;
  --text:#f6f7f8;
  --muted:#9299a0;
  --line:#3b4147;
  --red:#ff4658;
  --orange:#ff922f;
  --yellow:#f2d64b;
  --green:#19d99b;
  --purple:#9b7cff;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#0b0e11;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.app{
  width:min(100%,760px);
  margin:auto;
  padding:18px 14px 45px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.logo{
  font-size:21px;
  font-weight:900;
}

.logo span{color:var(--purple)}

.auto{
  color:var(--green);
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
}

h1{
  margin:0 0 4px;
  font-size:30px;
}

.sub{
  margin:0 0 22px;
  color:var(--muted);
}

.tuner{
  overflow:hidden;
  border:1px solid #ffffff14;
  border-radius:25px;
  background:#15191d;
}

/* SCALE */

.scale{
  position:relative;
  height:225px;
  padding-top:30px;
  border-bottom:1px solid #ffffff10;
}

.scale-line{
  position:absolute;
  left:8%;
  right:8%;
  top:94px;
  height:2px;
  background:#ffffff20;
}

.tick{
  position:absolute;
  top:76px;
  width:2px;
  height:37px;
  background:#dfe2e4;
  opacity:.85;
}

.tick.big{
  top:65px;
  height:58px;
}

.flat,.sharp{
  position:absolute;
  top:22px;
  font-size:32px;
  color:#c8ccd0;
}

.flat{left:7%}
.sharp{right:7%}

.target-box{
  position:absolute;
  top:61px;
  left:50%;
  transform:translateX(-50%);
  width:62px;
  height:66px;
  border-radius:6px;
  overflow:hidden;
  background:#96999c;
  border:2px solid #b7b9bb;
}

.target-fill{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:0%;
  background:var(--green);
  transition:height .08s linear;
}

.center{
  position:absolute;
  top:58px;
  bottom:92px;
  left:50%;
  width:3px;
  transform:translateX(-50%);
  background:#f3f3f3;
  z-index:4;
}

.marker{
  position:absolute;
  top:55px;
  left:50%;
  width:5px;
  height:78px;
  border-radius:4px;
  background:var(--red);
  transform:translateX(-50%);
  transition:left .09s linear,background .12s;
  z-index:5;
}

.reading{
  position:absolute;
  top:140px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  width:100%;
}

.cents{
  font-size:28px;
  font-weight:900;
}

.guide{
  margin-top:3px;
  font-size:17px;
  font-weight:700;
}

.hz{
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
}

/* HEADSTOCK */

.guitar-wrap{
  padding:27px 8px 20px;
}

.headstock-area{
  position:relative;
  width:min(100%,590px);
  height:315px;
  margin:auto;
}

.headstock{
  position:absolute;
  left:50%;
  top:20px;
  width:68%;
  height:245px;
  transform:translateX(-50%);
  clip-path:polygon(
    8% 5%,
    80% 10%,
    100% 29%,
    100% 72%,
    80% 90%,
    8% 95%,
    0 72%,
    0 28%
  );
  background:
    linear-gradient(90deg,#4e2b18,#945323 45%,#5c3019);
  border-radius:35px;
  box-shadow:inset 0 0 35px #0007;
}

.neck{
  position:absolute;
  right:0;
  top:96px;
  width:22%;
  height:94px;
  background:linear-gradient(#39251a,#65432d,#39251a);
  border-left:7px solid #e6e0d5;
}

/* SIX REAL VISUAL STRINGS */

.guitar-string{
  position:absolute;
  left:24%;
  right:2%;
  height:3px;
  background:#b8bcc0;
  transform-origin:right center;
  transition:background .15s,box-shadow .15s;
  z-index:5;
}

.gs1{top:107px;transform:rotate(6deg)}
.gs2{top:121px;transform:rotate(4deg)}
.gs3{top:137px;transform:rotate(2deg)}
.gs4{top:153px;transform:rotate(-2deg)}
.gs5{top:169px;transform:rotate(-4deg)}
.gs6{top:185px;transform:rotate(-6deg)}

.guitar-string.flash{
  background:var(--red);
  box-shadow:0 0 12px var(--red);
}

.guitar-string.tuned{
  background:var(--green);
  box-shadow:0 0 13px var(--green);
}

/* PEGS */

.peg{
  position:absolute;
  width:43px;
  height:43px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f5f5f5,#8b8f91 45%,#34383a 75%);
  border:2px solid #aeb2b5;
  z-index:7;
}

.p1{left:31%;top:54px}
.p2{left:46%;top:48px}
.p3{left:61%;top:54px}
.p4{left:31%;top:204px}
.p5{left:46%;top:210px}
.p6{left:61%;top:204px}

.peg.flash{
  border-color:var(--red);
  box-shadow:0 0 18px var(--red);
}

.peg.tuned{
  border-color:var(--green);
  box-shadow:0 0 18px var(--green);
}

/* STRING LABELS */

.string-button{
  position:absolute;
  width:55px;
  height:55px;
  border-radius:18px;
  border:2px solid #d9dcde;
  background:#191d21;
  color:white;
  font-size:20px;
  font-weight:900;
  z-index:10;
}

.s1{left:29%;top:0}
.s2{left:44%;top:0}
.s3{left:59%;top:0}
.s4{left:29%;top:252px}
.s5{left:44%;top:252px}
.s6{left:59%;top:252px}

.string-button.active{
  border-color:#fff;
  background:#fff;
  color:#15191d;
  box-shadow:0 0 20px #ffffff80;
}

.string-button.flash{
  border-color:var(--red);
  background:var(--red);
  color:white;
  box-shadow:0 0 18px var(--red);
}

.string-button.tuned{
  border-color:var(--green);
  background:var(--green);
  color:#052117;
  box-shadow:0 0 18px #19d99b88;
}

.controls{
  padding:0 18px 22px;
}

.start{
  width:100%;
  border:0;
  border-radius:16px;
  padding:16px;
  background:linear-gradient(90deg,var(--purple),var(--green));
  color:#08110e;
  font-weight:900;
  font-size:16px;
}

.status{
  margin-top:13px;
  min-height:20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.done{
  display:none;
  margin-top:15px;
  padding:14px;
  text-align:center;
  border:1px solid #19d99b66;
  border-radius:14px;
  color:var(--green);
  font-weight:900;
  background:#19d99b12;
}

@media(max-width:480px){
  .headstock-area{height:285px}
  .headstock{width:72%;height:220px}
  .neck{top:90px}
  .string-button{width:49px;height:49px}
  .s4,.s5,.s6{top:230px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">NOVA <span>MUSICAL</span></div>
  <div class="auto">AUTO TUNER</div>
</header>

<h1 id="title">Tune your guitar</h1>
<p class="sub">Standard tuning • E A D G B E</p>

<section class="tuner">

<div class="scale">

  <div class="flat">♭</div>
  <div class="sharp">♯</div>

  <div class="scale-line"></div>

  <div class="tick big" style="left:8%"></div>
  <div class="tick" style="left:16%"></div>
  <div class="tick" style="left:24%"></div>
  <div class="tick" style="left:32%"></div>
  <div class="tick" style="left:40%"></div>

  <div class="tick big" style="left:50%"></div>

  <div class="tick" style="left:60%"></div>
  <div class="tick" style="left:68%"></div>
  <div class="tick" style="left:76%"></div>
  <div class="tick" style="left:84%"></div>
  <div class="tick big" style="left:92%"></div>

  <div class="target-box">
    <div class="target-fill" id="targetFill"></div>
  </div>

  <div class="center"></div>
  <div class="marker" id="marker"></div>

  <div class="reading">
    <div class="cents" id="cents">—</div>
    <div class="guide" id="guide">Play any open string</div>
    <div class="hz" id="hz">Microphone is off</div>
  </div>

</div>


<div class="guitar-wrap">

<div class="headstock-area">

  <div class="headstock"></div>
  <div class="neck"></div>

  <div class="guitar-string gs1" id="line1"></div>
  <div class="guitar-string gs2" id="line2"></div>
  <div class="guitar-string gs3" id="line3"></div>
  <div class="guitar-string gs4" id="line4"></div>
  <div class="guitar-string gs5" id="line5"></div>
  <div class="guitar-string gs6" id="line6"></div>

  <div class="peg p1" id="peg1"></div>
  <div class="peg p2" id="peg2"></div>
  <div class="peg p3" id="peg3"></div>
  <div class="peg p4" id="peg4"></div>
  <div class="peg p5" id="peg5"></div>
  <div class="peg p6" id="peg6"></div>

  <button class="string-button s1" id="button1">1</button>
  <button class="string-button s2" id="button2">2</button>
  <button class="string-button s3" id="button3">3</button>
  <button class="string-button s4" id="button4">4</button>
  <button class="string-button s5" id="button5">5</button>
  <button class="string-button s6" id="button6">6</button>

</div>

</div>


<div class="controls">

<button class="start" id="start">
🎙 Start tuning
</button>

<div class="status" id="status">
Tap Start tuning and play one open string.
</div>

<div class="done" id="done">
✓ All six strings are tuned
</div>

</div>

</section>

</div>


<script>
const strings = [
  {n:6,name:"Low E",note:"E",hz:82.4069},
  {n:5,name:"A",note:"A",hz:110},
  {n:4,name:"D",note:"D",hz:146.8324},
  {n:3,name:"G",note:"G",hz:195.9977},
  {n:2,name:"B",note:"B",hz:246.9417},
  {n:1,name:"High E",note:"E",hz:329.6276}
];

let ctx=null;
let analyser=null;
let stream=null;
let data=null;
let running=false;

let pitchHistory=[];
let active=null;

const tuned=new Set();

let holdStart=null;
let holdString=null;

let lastBadFlash=0;
let lastSoundTime=0;

const marker=document.getElementById("marker");
const centsEl=document.getElementById("cents");
const guide=document.getElementById("guide");
const hzEl=document.getElementById("hz");
const fill=document.getElementById("targetFill");
const start=document.getElementById("start");
const status=document.getElementById("status");
const done=document.getElementById("done");
const title=document.getElementById("title");


start.addEventListener("click",async()=>{

  if(running){
    stop();
    return;
  }

  try{

    stream=await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:false,
        noiseSuppression:false,
        autoGainControl:false
      }
    });

    ctx=new (window.AudioContext||window.webkitAudioContext)();

    await ctx.resume();

    const source=ctx.createMediaStreamSource(stream);

    analyser=ctx.createAnalyser();
    analyser.fftSize=8192;
    analyser.smoothingTimeConstant=0;

    data=new Float32Array(analyser.fftSize);

    source.connect(analyser);

    running=true;
    pitchHistory=[];

    start.textContent="■ Stop tuning";
    hzEl.textContent="Listening…";
    status.textContent="Play one open guitar string.";

    loop();

  }catch(e){
    status.textContent="Please allow microphone access.";
  }

});


function stop(){

  running=false;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }

  if(ctx){
    ctx.close();
  }

  start.textContent="🎙 Start tuning";
  hzEl.textContent="Microphone is off";
}


function loop(){

  if(!running)return;

  analyser.getFloatTimeDomainData(data);

  const pitch=yin(data,ctx.sampleRate);

  if(pitch){

    const smooth=medianPitch(pitch);
    const s=nearestString(smooth);

    if(s){

      const cents=centsFrom(smooth,s.hz);

      if(Math.abs(cents)<=50){
        render(s,smooth,cents);
      }

    }

  }

  requestAnimationFrame(loop);
}


function centsFrom(f,target){
  return 1200*Math.log2(f/target);
}


function nearestString(f){

  let best=null;
  let distance=Infinity;

  strings.forEach(s=>{

    const d=Math.abs(centsFrom(f,s.hz));

    if(d<distance){
      distance=d;
      best=s;
    }

  });

  return best;
}


function medianPitch(f){

  if(pitchHistory.length){

    const previous=pitchHistory[pitchHistory.length-1];

    if(f/previous>1.88 && f/previous<2.12){
      f/=2;
    }

    if(f/previous>.47 && f/previous<.53){
      f*=2;
    }
  }

  pitchHistory.push(f);

  if(pitchHistory.length>5){
    pitchHistory.shift();
  }

  const sorted=[...pitchHistory].sort((a,b)=>a-b);

  return sorted[Math.floor(sorted.length/2)];
}


function colourFor(c){

  const a=Math.abs(c);

  if(a<=1)return "var(--green)";
  if(a<=5)return "var(--yellow)";
  if(a<=15)return "var(--orange)";

  return "var(--red)";
}


function render(s,f,c){

  active=s;

  const rounded=Math.round(c);

  const clamped=Math.max(-50,Math.min(50,c));

  marker.style.left=(50+(clamped/50)*42)+"%";

  const colour=colourFor(c);

  marker.style.background=colour;

  centsEl.style.color=colour;

  centsEl.textContent=
    (rounded>0?"+":"")+rounded+"¢";

  hzEl.textContent=
    s.name+" • "+f.toFixed(2)+" Hz";

  title.textContent=
    "Tune string "+s.n;


  clearActive();

  const button=document.getElementById("button"+s.n);

  if(!tuned.has(s.n)){
    button.classList.add("active");
  }


  if(Math.abs(c)<=1){

    guide.textContent="Hold it…";
    guide.style.color="var(--green)";

    beginHold(s);

  }else{

    resetHold();

    if(c<0){
      guide.textContent="Tune up";
    }else{
      guide.textContent="Tune down";
    }

    guide.style.color=colour;

    registerWrongAttempt(s,c);
  }
}


function beginHold(s){

  if(tuned.has(s.n)){
    fill.style.height="100%";
    guide.textContent="In tune ✓";
    return;
  }

  if(holdString!==s.n){

    holdString=s.n;
    holdStart=performance.now();
    fill.style.height="0%";
  }

  const elapsed=performance.now()-holdStart;

  const required=2000;

  const progress=Math.min(1,elapsed/required);

  fill.style.height=(progress*100)+"%";

  if(progress>=1){

    markTuned(s);

    holdStart=null;
    holdString=null;
  }
}


function resetHold(){

  holdStart=null;
  holdString=null;

  fill.style.height="0%";
}


function markTuned(s){

  tuned.add(s.n);

  const button=document.getElementById("button"+s.n);
  const peg=document.getElementById("peg"+s.n);
  const line=document.getElementById("line"+s.n);

  button.classList.remove("active","flash");
  peg.classList.remove("flash");
  line.classList.remove("flash");

  button.classList.add("tuned");
  peg.classList.add("tuned");
  line.classList.add("tuned");

  fill.style.height="100%";

  guide.textContent="In tune ✓";
  guide.style.color="var(--green)";

  status.textContent=s.name+" is tuned.";

  if(tuned.size===6){
    done.style.display="block";
    title.textContent="Guitar tuned ✓";
  }
}


function registerWrongAttempt(s,c){

  if(tuned.has(s.n))return;

  const now=performance.now();

  /*
    A new "attempt" is treated as a detected
    pluck after a short quiet/gap period.
    We don't continuously flash while the
    same note is ringing.
  */

  if(now-lastSoundTime>650){
    flashWrong(s);
  }

  lastSoundTime=now;
}


function flashWrong(s){

  const now=performance.now();

  if(now-lastBadFlash<450)return;

  lastBadFlash=now;

  const button=document.getElementById("button"+s.n);
  const peg=document.getElementById("peg"+s.n);
  const line=document.getElementById("line"+s.n);

  button.classList.remove("active");

  button.classList.add("flash");
  peg.classList.add("flash");
  line.classList.add("flash");

  setTimeout(()=>{

    if(!tuned.has(s.n)){
      button.classList.remove("flash");
      peg.classList.remove("flash");
      line.classList.remove("flash");
    }

  },330);
}


function clearActive(){

  strings.forEach(s=>{

    if(tuned.has(s.n))return;

    document
      .getElementById("button"+s.n)
      .classList.remove("active");

  });
}


/* YIN-STYLE PITCH DETECTION */

function yin(buffer,sampleRate){

  let rms=0;

  for(let i=0;i<buffer.length;i++){
    rms+=buffer[i]*buffer[i];
  }

  rms=Math.sqrt(rms/buffer.length);

  if(rms<0.01)return null;


  let mean=0;

  for(let i=0;i<buffer.length;i++){
    mean+=buffer[i];
  }

  mean/=buffer.length;


  const size=buffer.length;

  const clean=new Float32Array(size);

  for(let i=0;i<size;i++){
    clean[i]=buffer[i]-mean;
  }


  const minFreq=65;
  const maxFreq=380;

  const minTau=Math.floor(sampleRate/maxFreq);

  const maxTau=Math.min(
    Math.floor(sampleRate/minFreq),
    Math.floor(size/2)
  );


  const diff=new Float32Array(maxTau+1);


  for(let tau=1;tau<=maxTau;tau++){

    let sum=0;

    for(let i=0;i<size-tau;i++){

      const delta=clean[i]-clean[i+tau];

      sum+=delta*delta;
    }

    diff[tau]=sum;
  }


  const cmnd=new Float32Array(maxTau+1);

  cmnd[0]=1;

  let runningSum=0;


  for(let tau=1;tau<=maxTau;tau++){

    runningSum+=diff[tau];

    cmnd[tau]=
      runningSum===0
      ?1
      :diff[tau]*tau/runningSum;
  }


  let tau=-1;


  for(let t=minTau;t<=maxTau;t++){

    if(cmnd[t]<0.10){

      while(
        t+1<=maxTau &&
        cmnd[t+1]<cmnd[t]
      ){
        t++;
      }

      tau=t;
      break;
    }
  }


  if(tau===-1){

    let best=Infinity;

    for(let t=minTau;t<=maxTau;t++){

      if(cmnd[t]<best){
        best=cmnd[t];
        tau=t;
      }
    }

    if(best>.22)return null;
  }


  let refined=tau;


  if(tau>1 && tau<maxTau){

    const a=cmnd[tau-1];
    const b=cmnd[tau];
    const c=cmnd[tau+1];

    const denominator=2*(2*b-a-c);

    if(Math.abs(denominator)>.000001){
      refined=tau+(c-a)/denominator;
    }
  }


  const frequency=sampleRate/refined;

  if(
    !Number.isFinite(frequency) ||
    frequency<minFreq ||
    frequency>maxFreq
  ){
    return null;
  }

  return frequency;
}


/*
Nothing is stored permanently.

Leaving/reloading this page resets the
six tuned-string states automatically.
*/

</script>

</body>
</html>
